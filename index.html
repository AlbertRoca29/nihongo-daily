<!-- fonts are self-hosted (fonts/, subset to kana + ~3,200 kanji); other fonts load from Google only when chosen in Settings -->
<style>@font-face{font-family:"Zen Kaku Gothic New";src:url(fonts/zen-kaku-400.woff2) format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Zen Kaku Gothic New";src:url(fonts/zen-kaku-500.woff2) format("woff2");font-weight:500;font-display:swap}@font-face{font-family:"Zen Kaku Gothic New";src:url(fonts/zen-kaku-700.woff2) format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Kaisei Tokumin";src:url(fonts/kaisei-tokumin-700.woff2) format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Zen Maru Gothic";src:url(fonts/zen-maru-900.woff2) format("woff2");font-weight:900;font-display:swap}@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-var.woff2) format("woff2");font-weight:100 900;font-display:swap}</style>
<style>
/* Layout: one-screen phone app. Gradient "station board" hero card, a slim progress line of stops, big rounded cards on a soft canvas, pill buttons in the thumb zone. Fintech-clean, bold type. */
:root{
  --paper:#f2f3f5; --card:#ffffff; --ink:#111316; --muted:#5f6570; --rule:#e3e5e9; --soft:#eef1f6;
  --accent:#4f46e5; --accent-2:#2563eb; --on-accent:#ffffff; --good:#087a4f; --on-good:#ffffff;
  --grad:linear-gradient(135deg,#2b59ff 0%,#6d3cf5 55%,#a21caf 100%); --grad-ink:#2b2bd9;
  --btn:#111316; --on-btn:#ffffff; --ghost:#e6e8ec;
  --stamp:#d92d35; --stamp-fill:#d92d35; --polite:#2563eb; --casual:#c2410c;
  --slang:#a21caf; --archaic:#92400e; --star:#b45309; --line-green:#06c755; --pop:#ffffff;
  --ui:"Inter Tight","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Kaisei Tokumin","Hiragino Mincho ProN","Noto Serif JP",serif;
  --line:var(--accent); --line-ink:var(--on-accent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#000000; --card:#16171b; --ink:#f5f6f8; --muted:#848a95; --rule:#26282e; --soft:#1e2028;
  --accent:#8b84ff; --accent-2:#5b8cff; --on-accent:#ffffff; --good:#34d399; --on-good:#000000;
  --grad:linear-gradient(135deg,#2747d6 0%,#5a32d0 55%,#8e1f9e 100%); --grad-ink:#3a2fd0;
  --btn:#f5f6f8; --on-btn:#000000; --ghost:#24262c;
  --stamp:#ff6369; --stamp-fill:#d92d35; --polite:#7aa2ff; --casual:#ff8a4c;
  --slang:#e879f9; --archaic:#eab308; --star:#f5a524; --pop:#26282f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#000000; --card:#16171b; --ink:#f5f6f8; --muted:#848a95; --rule:#26282e; --soft:#1e2028;
  --accent:#8b84ff; --accent-2:#5b8cff; --on-accent:#ffffff; --good:#34d399; --on-good:#000000;
  --grad:linear-gradient(135deg,#2747d6 0%,#5a32d0 55%,#8e1f9e 100%); --grad-ink:#3a2fd0;
  --btn:#f5f6f8; --on-btn:#000000; --ghost:#24262c;
  --stamp:#ff6369; --stamp-fill:#d92d35; --polite:#7aa2ff; --casual:#ff8a4c;
  --slang:#e879f9; --archaic:#eab308; --star:#f5a524; --pop:#26282f; color-scheme:dark}

/* font setting (Settings on the home screen) */
/* never fake a bold: Brush and Bold title fonts come in one weight */
html{font-synthesis-weight:none}
/* scroll without a visible bar */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.date-btn{font-size:14px;font-weight:600;color:var(--ink);padding:7px 12px;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:999px;white-space:nowrap;min-width:0;overflow:hidden}
.date-btn #dateLabel{overflow:hidden;text-overflow:ellipsis}
.today-dot{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);padding:2px 7px;border-radius:999px}
.date-btn svg{width:15px;height:15px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;white-space:nowrap;flex:none}
.pill{width:40px;height:24px;border-radius:12px;background:var(--ghost);position:relative;transition:background .2s}
.pill::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-pressed="true"] .pill{background:var(--accent)}
/* small phones: the date keeps its 今日 badge, the switch keeps only its pill */
@media (max-width:359px){.toggle-t{display:none}}
.toggle[aria-pressed="true"] .pill::after{transform:translateX(16px)}

/* station board = gradient hero card */
.board{background:var(--grad);color:#fff;border-radius:24px;overflow:hidden;position:relative}
.board::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.board-main{text-align:left;padding:10px 16px 2px;position:relative;z-index:1}
.board-kicker{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.board-title{font-family:var(--ui);font-size:clamp(18px,5.2vw,22px);font-weight:700;line-height:1.25;letter-spacing:-.01em;text-wrap:balance;margin-top:2px}
.board-title rt{color:rgba(255,255,255,.75)}
.board-title:not(:has(rt)){padding-top:5px}
.board-en{font-size:12px;opacity:.85;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px 9px;font-size:12px;font-weight:600;position:relative;z-index:1}
.band .prev,.band .next{display:flex;min-width:0;flex:1}
.band .next{justify-content:flex-end}
.band span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:999px;max-width:100%}
.band .num{flex:none;background:#fff;color:var(--grad-ink);font-weight:700;border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;font-size:12px}

/* progress line */
.stops{--edge:8px;display:flex;align-items:center;height:16px;margin-top:6px;position:relative}
.stops::before{content:"";position:absolute;left:var(--edge);right:var(--edge);top:50%;height:3px;border-radius:2px;background:var(--ghost);transform:translateY(-50%)}
.stops .fill{position:absolute;left:var(--edge);top:50%;height:3px;border-radius:2px;background:var(--accent);transform:translateY(-50%);transition:width .3s}
.stop{flex:1;display:flex;justify-content:center;align-items:center;height:16px;position:relative;z-index:1}
.stop i{width:7px;height:7px;border-radius:50%;background:var(--ghost);display:block;transition:all .2s}
.stop.done i{background:var(--accent)}
.stop.here i{background:var(--card);width:9px;height:9px;box-shadow:0 0 0 2.5px var(--accent)}

/* stage */
.stage{flex:1;overflow-y:auto;padding-block:10px 8px;min-height:0;-webkit-overflow-scrolling:touch}
.step{display:flex;flex-direction:column;gap:10px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.pill::after,.stops .fill{transition:none}}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:20px;padding:16px}

ruby{ruby-position:over;ruby-align:center}
rt{font-size:.5em;color:var(--muted);font-weight:500;letter-spacing:0;transition:opacity .15s}
.furi-off rt{opacity:0}
.furi-off ruby.peek rt{opacity:1}
.furi-off ruby{cursor:pointer;border-bottom:1px dotted var(--muted)}
.furi-off .gl ruby{border-bottom:0}
/* hard words: underlined, tap for meaning */
.gl{cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--accent) 70%,transparent);border-radius:2px;-webkit-tap-highlight-color:transparent;transition:background .15s}
.fq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;flex:none}
.fq i{display:block;width:4px;border-radius:1px;background:color-mix(in srgb,var(--muted) 30%,transparent)}
.fq i:nth-child(1){height:4px}.fq i:nth-child(2){height:7px}.fq i:nth-child(3){height:10px}.fq i:nth-child(4){height:12px}
.fq i.on{background:var(--accent)}
.gpop-f{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
.fqchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.gl.gl-on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-bottom-style:solid}
.gl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.line.me .gl{border-bottom-color:rgba(255,255,255,.8)}
.line.me .gl.gl-on{background:rgba(255,255,255,.22)}
.gpop{position:fixed;z-index:60;box-sizing:border-box;background:var(--pop);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px var(--rule);display:flex;flex-direction:column;gap:4px;animation:in .15s ease}
.gpop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gpop-w{font-family:var(--jp);font-size:22px;font-weight:700;line-height:1.3}
.gpop-r{font-family:var(--jp);font-size:14px;color:var(--muted)}
.gpop-m{font-size:16px;font-weight:600;line-height:1.35}

.jp-big{font-family:var(--jp);font-size:clamp(21px,6.4vw,26px);font-weight:700;line-height:1.95;word-break:keep-all;overflow-wrap:anywhere}
.jp-mid{font-family:var(--jp);font-size:18px;font-weight:500;line-height:2;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.02em;padding:5px 12px;border-radius:999px;background:var(--soft);text-transform:capitalize}
.chip.polite{color:var(--polite)} .chip.casual{color:var(--casual)} .chip.neutral{color:var(--muted)}
.chip.dialect{color:var(--good)} .chip.slang{color:var(--slang)} .chip.archaic{color:var(--archaic)}
.say{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);padding:8px 13px;border-radius:999px;background:var(--ghost)}
.say svg{width:15px;height:15px}
.reveal{width:100%;text-align:left;border-radius:16px;padding:13px 16px;color:var(--muted);font-size:15px;font-weight:600;background:var(--card);border:1.5px dashed var(--ghost)}
.reveal.open{border:1.5px solid transparent;background:var(--soft);color:var(--ink);font-weight:500}
.note{font-size:14px;color:var(--muted)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:600}

/* intro */
.agenda-row{display:flex;flex-wrap:wrap;gap:6px}
.agenda-row span{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--card);color:var(--ink)}
.bubble-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.bubble{cursor:pointer}
.play{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ghost);color:var(--ink);margin-top:6px}
.play svg{width:14px;height:14px}
.line.me .play{background:rgba(255,255,255,.22);color:#fff}
.lines .who{padding:0 8px}
.agenda{display:grid;gap:9px;list-style:none;padding:0;margin:0}
.agenda li{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:500}
.agenda b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-variant-numeric:tabular-nums;flex:none}

/* dialogue */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.line.me{align-items:flex-end}
.who{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.bubble{background:var(--card);border-radius:18px 18px 18px 6px;padding:6px 10px 6px 14px;max-width:90%;min-width:0}
.line.me .bubble{background:var(--grad);color:#fff;border-radius:18px 18px 6px 18px}
.line.me .bubble rt{color:rgba(255,255,255,.75)}
.bubble .en{font-size:13.5px;color:var(--muted);margin:2px 0 4px;padding-top:4px;border-top:1px solid var(--rule)}
.bubble .en.hid{display:none}
.line.me .bubble .en{color:rgba(255,255,255,.85);border-top-color:rgba(255,255,255,.25)}
.bubble .en.hid{color:transparent!important;background:var(--ghost);border-radius:6px;border-top-color:transparent;user-select:none}
.line.me .bubble .en.hid{background:rgba(255,255,255,.22)}
.bubble-tools{display:flex;gap:14px;margin-top:4px}
.mini{font-size:12px;font-weight:700;color:var(--accent);padding:4px 0}
.line.me .mini{color:#fff}

/* kanji sign */
.sign{background:var(--card);border-radius:24px;overflow:hidden;text-align:center}
.sign-top{padding:20px 12px 12px}
.sign-k{font-family:var(--mincho);font-size:clamp(52px,17vw,72px);line-height:1.1;letter-spacing:.06em}
.sign-r{font-size:18px;font-weight:600;color:var(--muted);margin-top:8px;min-height:1.6em}
.sign-bar{background:var(--grad);color:#fff;font-weight:700;padding:9px;font-size:13px;letter-spacing:.14em}

/* tip */
.tip h3{margin:0;font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.tip p{margin:0;font-size:16px}
.hanko{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--grad);color:#fff;font-family:var(--mincho);font-size:22px}

/* challenge */
textarea{width:100%;min-height:78px;resize:vertical;font-family:var(--jp);font-size:18px;line-height:1.6;padding:14px 16px;border:2px solid transparent;border-radius:20px;background:var(--card);color:var(--ink);box-sizing:border-box}
textarea:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16px}
.btn.primary{background:var(--btn);color:var(--on-btn)}
.btn.ghost{background:var(--ghost);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.fb{display:flex;flex-direction:column;gap:12px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700}
.fb .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* nav */
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:8px 12px}
.nav .btn{width:100%}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-height:70%;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.sheet h2{font-size:20px;font-weight:700;margin:0 0 8px}
.lesson-item{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--rule);font-weight:500}
.lesson-item small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lesson-item.cur{color:var(--accent);font-weight:700}

/* review: stars, cards, quiz */
.star{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-size:19px;line-height:1;color:var(--muted);background:var(--ghost)}
.star.on{color:var(--star)}
.line.me .star{background:rgba(255,255,255,.22);color:#fff}
.line.me .star.on{color:#ffd166}
mark{background:var(--soft);color:var(--accent);border-radius:5px;padding:0 3px;font-weight:700}
.line.me mark{background:rgba(255,255,255,.25);color:#fff}
.lvl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.lvl.N3,.lvl.N2,.lvl.N1{color:var(--accent)}
.vrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.vrow:last-child{border-bottom:0;padding-bottom:0}
.vrow:first-child{padding-top:0}
.vrow .src{font-family:var(--jp);font-size:13px;color:var(--muted);margin-top:2px}
.kbig{font-family:var(--mincho);font-size:64px;line-height:1.1}
.pad{display:flex;flex-direction:column;gap:8px;align-items:center}
.pad-box{position:relative;width:min(100%,300px);aspect-ratio:1;border-radius:16px;background:var(--soft);overflow:hidden;touch-action:none}
.pad-box .guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-size:min(220px,62vw);line-height:1;color:var(--ink);opacity:.12;pointer-events:none;user-select:none}
.pad-box .guide.off{opacity:0}
.pad-box svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--muted);opacity:.35}
.pad-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad-tools{display:flex;gap:8px;width:min(100%,300px)}
.pad-tools .btn{flex:1;white-space:nowrap;min-height:40px;padding:0 12px;font-size:14px}
.kread{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.kread b{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;padding:12px 16px;border-radius:14px;background:var(--card);font-weight:600;border:1.5px solid var(--ghost)}
.opt.jpo{font-family:var(--jp);font-size:18px}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--stamp);color:var(--stamp)}
.opt:disabled{cursor:default}
.qprompt{font-family:var(--jp);font-size:clamp(24px,7vw,30px);font-weight:700;line-height:1.5;text-align:center;padding:6px 0}
.qprompt.k{font-family:var(--mincho);font-size:60px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.good{background:var(--good);color:var(--on-good)}
.wsent{font-family:var(--jp);font-size:21px;font-weight:500;line-height:1.9;overflow-wrap:anywhere}

/* cast */
.cast{display:flex;flex-direction:column;gap:8px}

.sgrid button{background:var(--card);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;border:2px solid transparent}
.sgrid button img{width:48px;height:48px}
.sgrid button b{font-family:var(--jp);font-size:11px}
.sgrid button.right{border-color:var(--good)} .sgrid button.wrong{border-color:var(--stamp)}

/* review: 4 grades */
.grade4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade4 button{min-height:52px;border-radius:14px;background:var(--ghost);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.grade4 button small{font-size:11px;font-weight:600;color:var(--muted)}
.grade4 button.g3{background:var(--good);color:var(--on-good)} .grade4 button.g3 small{color:inherit;opacity:.8}
.ctype{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent);font-family:var(--jp)}

/* people */
.frow{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.frow:last-child{border-bottom:0}
.frow .tx{flex:1;min-width:0}
.frow .tx b{font-family:var(--jp);font-size:16px}
.frow .tx div{font-family:var(--jp);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow.locked{opacity:.5}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.facts{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}

/* kanji states */
.kcell.s0{opacity:.6} .kcell .stt{font-size:10px;font-weight:700;letter-spacing:.04em}
.kcell.s2{box-shadow:inset 0 0 0 2px var(--good)} .kcell.s2 .stt{color:var(--good)} .kcell.s1 .stt{color:var(--star)} .kcell.s0 .stt{color:var(--muted)}

/* sheet, toast, radio */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:40}
.sheet2{background:var(--paper);width:100%;max-width:560px;margin:0 auto;max-height:86%;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--on-btn);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%;text-align:center}
.rtl{display:flex;flex-direction:column;gap:6px}
.rtl div{font-size:14px;opacity:.5;transition:opacity .2s}
.rtl div.on{opacity:1}
.rtl div.h{font-weight:700;color:var(--accent);margin-top:6px;opacity:1}
.rtl b{display:block;font-size:11px;color:var(--muted)}
audio{width:100%}
.offline{font-size:12px;font-weight:700;color:var(--good);background:var(--card);border-radius:999px;padding:4px 10px;font-family:var(--jp)}
.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pairs button{background:var(--soft);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-weight:600;font-size:12px}
.pairs button b{font-size:20px;color:var(--ink);font-weight:500}
.pairs button[aria-pressed="true"]{background:var(--card);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
details.more summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);padding:6px 0}
.dtab{width:100%;border-collapse:collapse;font-size:14px}
.dtab td{padding:6px 0;border-bottom:1px solid var(--rule)}
.dtab td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.mic{background:var(--stamp-fill)!important;color:#fff!important}
.diffok{color:var(--good)} .diffno{color:var(--stamp);text-decoration:underline}
.mock-sec{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);font-family:var(--jp)}
.slots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-family:var(--jp);font-size:18px;justify-content:center;line-height:2}
.slots span.s{min-width:56px;border-bottom:2px solid var(--ink);text-align:center;padding:0 3px;min-height:30px}
.slots span.s.star{border-bottom-color:var(--stamp)}
</style>
<style>
/* ===== r3: less text. One screen per step, Japanese first, English on tap, one thing per card ===== */
.scene{display:flex;gap:12px;align-items:center}
.scene p{margin:0;font-size:16px;line-height:1.45}
.scene .faces{display:flex;flex:none}

.btn-row{display:flex;gap:8px}

.card .agenda-row span{background:var(--soft)}

<body>
<div class="app" id="app">
  <main class="home" id="home"><div class="empty step"><h2>一日一歩</h2><p class="note">Loading…</p></div></main>
  <main class="page" id="page" hidden></main>

  <div class="ptop" id="top" hidden>
    <div class="pline"><i id="pfill" style="width:0"></i></div>
    <div class="prow">
      <div class="lbl"><a class="icon-btn" href="#" id="homeBtn" aria-label="Home"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M2 7.2 8 2l6 5.2M3.8 6v7.5h8.4V6"/></svg></a>
        <span class="tab" id="ptab"></span><span class="st" id="pstep"></span><span class="n" id="pnum"></span></div>
      <button class="furi3" id="furiBtn" aria-label="Furigana"></button>
    </div>
  </div>

  <main class="stage" id="stage" hidden></main>

  <nav class="nav" id="nav" hidden>
    <button class="btn ghost" id="back">Back</button>
    <button class="btn primary" id="next">Next</button>
  </nav>
</div>
<div id="sheet" class="sheet-wrap" hidden><div class="sheet2" id="sheetBody" role="dialog"></div></div>
<audio id="player" preload="none" hidden></audio>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  };
  const APP_TITLE = ["一日一歩", "いちにち いっぽ"];
  const ICON_SAY = '<svg viewBox="0 0 16 16" fill="currentColor" width="15" height="15"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

  /* ---------- markup: {漢字|かんじ}, {漢字|かんじ|meaning|N} ---------- */
  const MARK = /\{([^|{}]+)\|([^|{}]*)(?:\|([^|{}]+)(?:\|([1-4]))?)?\}/g;
  const FREQ = {4:"Everyday · you'll hear it all the time", 3:"Common · comes up regularly", 2:"Occasional · specific situations or more formal", 1:"Rare · regional, old-fashioned or very formal"};
  const FREQ_SHORT = {4:"Everyday", 3:"Common", 2:"Occasional", 1:"Rare"};
  const freqBars = f => `<span class="fq fq${f}" aria-label="${FREQ_SHORT[f]}">${[1,2,3,4].map(i => `<i class="${i <= f ? "on" : ""}"></i>`).join("")}</span>`;
  const plain = s => String(s ?? "").replace(MARK, "$1");
  const KANA = /^[ぁ-ゖゝゞー]+$/;
  const isKanji = ch => /[一-鿿㐀-䶿々]/.test(ch);
  // kanji segments of a word with their readings: 覚えてる/おぼえてる → [["覚","おぼ"]]; 出発/しゅっぱつ → [["出発","しゅっぱつ"]]
  const segPairs = (b, r) => {
    if (!r) return [];
    const segs = b.match(/[ぁ-ゖゝゞー]+|[^ぁ-ゖゝゞー]+/g) || [b];
    if (segs.length > 1){
      const re = new RegExp("^" + segs.map(s => KANA.test(s) ? s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") : "(.+?)").join("") + "$");
      const m = re.exec(r);
      if (m){ let g = 1; return segs.filter(s => !KANA.test(s)).map(s => [s, m[g++]]); }
    }
    return [[b, r]];
  };

  /* ---------- kanji dictionary + adaptive furigana ---------- */
  let KD = {};
  const kdLoad = fetch("data/kanji.json").then(r => r.ok ? r.json() : {k:{}}).then(j => { KD = j.k || {}; }).catch(() => {});
  const getKR = () => store.get("kr", {});
  // eligible: every kanji in the segment is N5 or N4 (KANJIDIC JLPT field 5 or 4)
  const easyKanji = seg => [...seg].filter(isKanji).every(ch => KD[ch] && KD[ch][4] >= 4);
  const known = (seg, r, KR) => easyKanji(seg) && ((KR || getKR())[seg + ":" + r] || 0) >= 3;
  const rubyWord = (b, r, KR) => {
    if (!r) return b;
    const segs = b.match(/[ぁ-ゖゝゞー]+|[^ぁ-ゖゝゞー]+/g) || [b];
    const rb = (s, rd) => `<ruby>${s}<rt${known(s, rd, KR) ? ' class="kn"' : ""}>${rd}</rt></ruby>`;
    if (segs.length > 1){
      const re = new RegExp("^" + segs.map(s => KANA.test(s) ? s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") : "(.+?)").join("") + "$");
      const m = re.exec(r);
      if (m){ let g = 1; return segs.map(s => KANA.test(s) ? s : rb(s, m[g++])).join(""); }
    }
    return rb(b, r);
  };
  const glossSrc = [];
  const ruby = s => {
    const raw = String(s ?? ""), si = raw.includes("|") ? glossSrc.push(raw) - 1 : -1, KR = getKR();
    return esc(raw).replace(MARK, (m, b, r, g, f) => {
      if (!g) return r ? rubyWord(b, r, KR) : m;
      return `<span class="gl" tabindex="0" role="button" data-b="${b}" data-gl="${g}" data-r="${r}" data-f="${f || ""}" data-si="${si}">${rubyWord(b, r, KR)}</span>`;
    });
  };

  let lessons = [], lesson = null, steps = [], idx = 0, castById = {}, STK = {};
  const FMT = {dialogue:{jp:"会話", en:"Dialogue"}, line:{jp:"LINE", en:"LINE chat"}, story:{jp:"お話", en:"Story"}, text:{jp:"読み物", en:"Real text"}, mock:{jp:"模試", en:"Mock exam"}};
  const fmtOf = L => FMT[L.format] ? L.format : "dialogue";
  const person = id => castById[id];

  /* ---------- furigana mode: on / adaptive / off ---------- */
  let furiMode = store.get("furiMode", store.get("furi", true) ? "on" : "off");
  const FURI_LABEL = {on:"ふりがな", adaptive:"ふりがな · 自動", off:"ふりがな off"};
  const applyFuri = () => {
    document.body.classList.toggle("furi-off", furiMode === "off");
    document.body.classList.toggle("furi-ad", furiMode === "adaptive");
    $("furiBtn").dataset.m = furiMode; $("furiBtn").textContent = FURI_LABEL[furiMode];
  };
  $("furiBtn").onclick = () => { furiMode = {on:"adaptive", adaptive:"off", off:"on"}[furiMode]; store.set("furiMode", furiMode); applyFuri(); toast(furiMode === "adaptive" ? "Furigana hides on easy kanji you've got right 3 times in a row" : FURI_LABEL[furiMode]); };
  document.addEventListener("click", e => { const r = e.target.closest("ruby"); if (r && furiMode !== "on") r.classList.toggle("peek"); });
  applyFuri();

  /* ---------- toast + sheet ---------- */
  let tt = null;
  const toast = msg => { let t = $("toast"); if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); };
  const openSheet = html => { $("sheetBody").innerHTML = html; $("sheet").hidden = false; };
  const closeSheet = () => { $("sheet").hidden = true; $("sheetBody").innerHTML = ""; stopAll(); };
  $("sheet").onclick = e => { if (e.target === $("sheet") || e.target.closest("[data-close]")) closeSheet(); };

  /* ---------- glosses ---------- */
  const gpop = document.createElement("div");
  gpop.className = "gpop"; gpop.id = "gpop"; gpop.hidden = true; gpop.setAttribute("role", "dialog");
  document.body.appendChild(gpop);
  let gFor = null;
  const hideGloss = () => { if (gFor) gFor.classList.remove("gl-on"); gpop.hidden = true; gFor = null; };
  const showGloss = el => {
    if (gFor === el){ hideGloss(); return; }
    hideGloss();
    const base = el.dataset.b, r = el.dataset.r || "", g = el.dataset.gl || "", f = el.dataset.f || "", src = glossSrc[+el.dataset.si] || "";
    const v = lesson && (lesson.vocab || []).find(x => plain(x.jp) === base || x.surface === base)
      || lesson && (lesson.vocab || []).find(x => x.surface && x.surface.length > 1 && (base.startsWith(x.surface) || x.surface.startsWith(base)));
    const line = lesson && [...(lesson.phrases || []), ...(lesson.dialogue || [])].find(x => x.jp === src);
    const key = "w:" + (v ? plain(v.jp) : base);
    const def = v ? wordDef(lesson, v) : {kind:"word", word:r ? `{${base}|${r}}` : base, reading:r || base, en:g, note:"", surface:base, sent:src, sentEn:line ? line.en : "", lesson:lesson ? lesson.id : "", who:line && line.who};
    const KR = getKR(), pairs = segPairs(base, r).filter(([s]) => easyKanji(s));
    gpop.innerHTML = `<div class="gpop-top"><div style="min-width:0"><div class="gpop-w">${esc(base)}</div>${r ? `<div class="gpop-r">${esc(r)}</div>` : ""}</div>
        <div style="display:flex;gap:6px">${v ? `<button class="star" data-play="w:${esc(plain(v.jp))}" aria-label="Play">${ICON_SAY}</button>` : ""}${starBtn(key, def)}</div></div>
      <div class="gpop-m">${esc(g)}</div>${f ? `<div class="gpop-f">${freqBars(f)}<span>${esc(FREQ[f])}</span></div>` : ""}${v && v.note ? `<div class="note">${ruby(v.note)}</div>` : ""}
      ${pairs.length ? `<div class="gpop-k" style="gap:6px">${pairs.map(([s, rd]) => `<button class="switch" data-know="${esc(s)}:${esc(rd)}"><span><b>${esc(s)}</b>${esc(rd)}</span><span class="fqchip">${(KR[s + ":" + rd] || 0) >= 3 ? "✓ 100% known" : "I know this reading 100%"}</span></button>`).join("")}</div>` : ""}
      <div class="gpop-k" data-kk hidden></div>`;
    gpop.hidden = false; gFor = el; el.classList.add("gl-on");
    const ks = [...new Set([...base].filter(isKanji))], rows = ks.filter(ch => KD[ch]).map(ch => `<div><b>${esc(ch)}</b>${esc(KD[ch][0])}</div>`).join("");
    const box = gpop.querySelector("[data-kk]"); if (rows){ box.innerHTML = rows; box.hidden = false; }
    const b = el.getBoundingClientRect(), W = innerWidth, H = innerHeight, pw = Math.min(300, W - 32);
    gpop.style.width = pw + "px";
    gpop.style.left = Math.max(16, Math.min(W - pw - 16, b.left + b.width / 2 - pw / 2)) + "px";
    const ph = gpop.offsetHeight, below = b.bottom + 8;
    gpop.style.top = (below + ph < H - 12 || b.top - ph - 8 < 12 ? below : b.top - ph - 8) + "px";
  };
  document.addEventListener("click", e => {
    const kn = e.target.closest("[data-know]");
    if (kn){ const KR = getKR(), k = kn.dataset.know; KR[k] = (KR[k] || 0) >= 3 ? 0 : 99; store.set("kr", KR); kn.lastElementChild.textContent = KR[k] >= 3 ? "✓ 100% known" : "I know this reading 100%"; return; }
    if (e.target.closest("#gpop")) return;
    const el = e.target.closest(".gl");
    if (el){ e.stopPropagation(); e.preventDefault(); showGloss(el); return; }
    if (gFor) hideGloss();
  }, true);
  document.addEventListener("keydown", e => {
    const el = e.target.closest && e.target.closest(".gl");
    if (el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); showGloss(el); }
    if (e.key === "Escape"){ hideGloss(); closeSheet(); }
  });
  addEventListener("scroll", hideGloss, true);
  addEventListener("resize", hideGloss);

  /* ---------- audio: one player, recorded voices only (no robot voice) ---------- */
  const player = $("player");
  const audioMaps = {};
  const loadAudio = async (id, fresh) => {
    if (audioMaps[id] && !fresh) return audioMaps[id];
    try{ const r = await fetch("audio/" + id + ".json", {cache:"no-cache"}); audioMaps[id] = r.ok ? await r.json() : {}; }
    catch{ audioMaps[id] = audioMaps[id] || {}; }
    return audioMaps[id];
  };
  const findIn = (m, keys, slow) => {
    for (const k of keys) if (k){ const v = m[slow ? "slow:" + k : k]; if (typeof v === "string") return v; }
    return null;
  };
  let playRun = 0;
  const stopAll = () => { playRun++; try{ player.pause(); }catch{} };
  // resolves when the clip ends; returns false if there was no audio
  const playOne = async (lid, keys, slow, run) => {
    let m = await loadAudio(lid), src = findIn(m, keys, slow), rate = 1;
    if (!src && slow){ src = findIn(m, keys, false); rate = 0.8; }
    if (!src){ m = await loadAudio(lid, true); src = findIn(m, keys, slow) || findIn(m, keys, false); }
    if (run !== playRun) return true;
    if (!src){ toast("音声準備中 · the audio for this is on its way"); return false; }
    return new Promise(done => {
      player.src = src; player.preservesPitch = true; player.playbackRate = rate;
      player.onended = () => done(true); player.onerror = () => done(false);
      player.play().catch(() => done(false));
    });
  };
  const play = (lid, keys, slow) => { stopAll(); return playOne(lid, keys, slow, playRun); };
  const playChain = async (lid, list, gap = 350, onEach) => {
    stopAll(); const run = playRun;
    for (let i = 0; i < list.length; i++){
      if (run !== playRun) return;
      if (onEach) onEach(i);
      await playOne(lid, list[i], false, run);
      await new Promise(r => setTimeout(r, gap));
    }
    if (onEach && run === playRun) onEach(-1);
  };
  // data-play="key1|key2" (+ data-lid, data-slow)
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-play]");
    if (!b) return;
    e.stopPropagation();
    play(b.dataset.lid || (lesson && lesson.id), b.dataset.play.split("|"), b.dataset.slow === "1");
  }, true);
  const pbtn = (keys, label, slow, lid) => `<button class="say" data-play="${esc(keys.filter(Boolean).join("|"))}"${slow ? ' data-slow="1"' : ""}${lid ? ` data-lid="${esc(lid)}"` : ""}>${label || ICON_SAY}</button>`;

  /* ---------- deck: everything comes back; spaced by how well you know it ---------- */
  const ymd = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const todayStr = () => ymd(new Date());
  const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
  const OLD_INT = [1, 2, 4, 8, 16, 32, 64];
  const NEW_PER_DAY = 8, REV_PER_DAY = 40, WARM_MAX = 6;
  const getDeck = () => {
    const d = store.get("deck", {});
    for (const c of Object.values(d)) if (c.s == null){ c.s = OLD_INT[c.box || 0] || 1; c.star = c.star ?? !c.auto; c.reps = c.reps || (c.seen ? 1 : 0); c.isNew = !c.seen; }
    return d;
  };
  const saveDeck = d => store.set("deck", d);
  const cardDefs = {};
  const inDeck = k => !!getDeck()[k];
  const isStar = k => { const c = getDeck()[k]; return !!(c && c.star); };
  const putCard = (k, def, star) => {
    const d = getDeck(), t = todayStr();
    if (d[k]){ if (star) d[k].star = true; saveDeck(d); return; }
    d[k] = Object.assign({}, def, {k, added:t, due:addDays(t, 1), s:0, reps:0, streak:0, isNew:true, star:!!star, auto:!star});
    saveDeck(d);
  };
  const toggleStar = k => {
    const d = getDeck(), c = d[k];
    if (!c){ if (cardDefs[k]) putCard(k, cardDefs[k], true); return; }
    if (c.star && !c.auto) delete d[k]; else c.star = !c.star;
    saveDeck(d);
  };
  const starBtn = (key, def) => {
    cardDefs[key] = def;
    const on = isStar(key);
    return `<button class="star ${on ? "on" : ""}" data-star="${esc(key)}" aria-pressed="${on}" aria-label="${on ? "Unstar" : "Star: show me this one more"}">${on ? "★" : "☆"}</button>`;
  };
  const paintStars = key => document.querySelectorAll(`[data-star="${CSS.escape(key)}"]`).forEach(b => {
    const on = isStar(key); b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; b.setAttribute("aria-pressed", String(on));
  });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-star]"); if (!b) return;
    e.stopPropagation(); toggleStar(b.dataset.star); paintStars(b.dataset.star);
  }, true);
  const savedOn = day => Object.values(getDeck()).filter(c => c.added === day).length;

  // knowledge of kanji readings (adaptive furigana): +1 per right answer, back to 0 on a miss
  const creditReadings = (c, ok) => {
    const s = c.word || c.sent || ""; if (!s) return;
    const KR = getKR();
    for (const m of String(s).matchAll(MARK)) for (const [seg, rd] of segPairs(m[1], m[2])){ const k = seg + ":" + rd; if (KR[k] >= 99) continue; KR[k] = ok ? (KR[k] || 0) + 1 : 0; }
    store.set("kr", KR);
  };
  const nextGap = (c, g) => {
    const s = c.s || 0;
    if (c.isNew) return {1:1, 2:1, 3:2, 4:5}[g];
    return {1:1, 2:Math.max(1, Math.round(s * 1.2)), 3:Math.max(2, Math.round(s * 2.3)), 4:Math.max(4, Math.round(s * 3.2))}[g];
  };
  const gapLabel = n => n < 30 ? n + "d" : Math.round(n / 30) + "mo";
  function grade(c, g, practice){
    if (practice) return;
    const d = getDeck(), x = d[c.k]; if (!x) return;
    const gap = nextGap(x, g), t = todayStr();
    if (x.isNew){ const nd = store.get("newday", {}); store.set("newday", {d:t, n:(nd.d === t ? nd.n : 0) + 1}); }
    x.s = g === 1 ? 1 : gap; x.due = addDays(t, gap); x.seen = t; x.reps = (x.reps || 0) + 1; x.isNew = false;
    x.streak = g >= 3 ? (x.streak || 0) + 1 : 0;
    saveDeck(d);
    creditReadings(x, g >= 3);
    if (x.kind === "kanji"){ const ks = store.get("kstate", {}); ks[x.kanji] = Object.assign(ks[x.kanji] || {}, {streak:x.streak}); store.set("kstate", ks); }
    logDay("r", 1);
  }
  const byDue = (a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
  function dueToday(){
    const t = todayStr(), all = Object.values(getDeck()).filter(c => c.added < t);
    const rev = all.filter(c => !c.isNew && c.due <= t).sort(byDue).slice(0, REV_PER_DAY);
    const nd = store.get("newday", {}), left = Math.max(0, NEW_PER_DAY - (nd.d === t ? nd.n : 0));
    const fresh = all.filter(c => c.isNew).sort((a, b) => (b.star - a.star) || (a.added < b.added ? -1 : 1)).slice(0, left);
    return [...rev, ...fresh];
  }
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* card definitions */
  const lineOf = (L, src) => { const m = /^([pd])(\d+)$/.exec(src || ""); return m ? ((m[1] === "p" ? L.phrases : L.dialogue) || [])[+m[2]] : null; };
  const wordDef = (L, v) => { const line = lineOf(L, v.src) || {}; return {kind:"word", word:v.jp, reading:v.reading, en:v.en, note:v.note || "", surface:v.surface, sent:line.jp || "", sentEn:line.en || "", src:v.src, lesson:L.id, who:line.who || ""}; };
  const kanjiDef = (L, k) => ({kind:"kanji", kanji:k.kanji, on:k.on || "", kun:k.kun || "", meaning:k.meaning, words:k.words || [], decoys:k.decoys || {}, lesson:L.id});
  const lineDef = (L, line, ref) => ({kind:"line", sent:line.jp, sentEn:line.en, src:ref, lesson:L.id, who:line.who || ""});
  const grammarDef = (L, G) => { const ref = (G.src || [])[0], line = lineOf(L, ref) || (G.examples || [])[0] || {}; return {kind:"grammar", pattern:G.pattern, meaning:G.meaning, form:G.form || "", level:G.level || "", sent:line.jp || "", sentEn:line.en || "", src:ref, lesson:L.id}; };
  const freqOf = (L, v) => {
    const line = lineOf(L, v.src); if (!line) return "";
    const sf = v.surface || plain(v.jp);
    for (const m of String(line.jp || "").matchAll(MARK)) if (m[3] && m[4] && (m[1] === sf || m[1].includes(sf) || sf.includes(m[1]))) return m[4];
    return "";
  };
  // a finished lesson puts its words (except rare ones), kanji and grammar point in the deck
  function addLessonToDeck(L){
    let n = 0;
    (L.vocab || []).forEach(v => { if (freqOf(L, v) === "1") return; const k = "w:" + plain(v.jp); if (!inDeck(k)){ putCard(k, wordDef(L, v), false); n++; } });
    (L.kanji_study || []).forEach(k => { const key = "k:" + k.kanji; if (!inDeck(key)){ putCard(key, kanjiDef(L, k), false); n++; } });
    if (L.grammar && L.category !== "review"){ const k = "g:" + L.grammar.id; if (!inDeck(k)){ putCard(k, grammarDef(L, L.grammar), false); n++; } }
    return n;
  }

  /* ---------- kanji states: 見た · 読めた · 覚えた ---------- */
  const kstate = () => store.get("kstate", {});
  const markKanji = (list, field) => { const s = kstate(); (list || []).forEach(k => { if (!k || !k.kanji) return; s[k.kanji] = Object.assign(s[k.kanji] || {}, {on:k.on || "", kun:k.kun || "", meaning:k.meaning || "", [field]:true}); }); store.set("kstate", s); };
  // keep the old "kseen" list working
  (() => { const old = store.get("kseen", null); if (old && !store.get("kstate", null)){ const s = {}; for (const [k, v] of Object.entries(old)) s[k] = Object.assign({}, v, {seen:true}); store.set("kstate", s); } })();
  const kLevel = v => (v.streak || 0) >= 3 ? 2 : v.quiz ? 1 : 0;
  const K_LABEL = ["見た", "読めた", "覚えた"];

  /* ---------- multiple-choice runner ---------- */
  function runQuiz(box, qs, done){
    let qi = 0, right = 0;
    const show = () => {
      if (qi >= qs.length){ done(right, qs.length); return; }
      const q = qs[qi], opts = shuffle(q.options.map((o, i) => ({o, ok:i === 0})));
      box.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:10px">
          ${q.ask || qs.length > 1 ? `<div class="row"><span class="label">${esc(q.ask)}</span>${qs.length > 1 ? `<span class="count">${qi+1}/${qs.length}</span>` : ""}</div>` : ""}
          <div class="qprompt ${q.cls || ""}">${q.prompt}</div></div>
        <div class="opts">${opts.map((x, i) => `<button class="opt ${q.jpo ? "jpo" : ""}" data-o="${i}">${esc(x.o)}</button>`).join("")}</div><div class="qafter"></div>`;
      box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
        const pick = opts[+b.dataset.o];
        box.querySelectorAll("[data-o]").forEach((bb, i) => { bb.disabled = true; if (opts[i].ok) bb.classList.add("right"); });
        if (pick.ok){ right++; if (q.onRight) q.onRight(); } else { b.classList.add("wrong"); if (q.onWrong) q.onWrong(); }
        box.querySelector(".qafter").innerHTML = `${q.note ? `<p class="note" style="margin:4px 0 0">${q.note}</p>` : ""}${!pick.ok && q.wrongNote ? `<p class="note" style="margin:4px 0 0">${q.wrongNote}</p>` : ""}<button class="btn primary" style="width:100%;margin-top:8px">${qi === qs.length - 1 ? "Finish" : "Next question"}</button>`;
        box.querySelector(".qafter .btn").onclick = () => { qi++; show(); };
      });
    };
    show();
  }

  /* ---------- people, avatars, line colours ---------- */
  const PORTRAITS = new Set(["tanaka","yuki","kenta","sato","hana","ren","sota","mio","hayato","keiko","you"]);
  const idOf = (who, name, me) => {
    if (me || who === "you") return "you";
    if (who && who !== "guest" && PORTRAITS.has(who)) return who;
    const c = Object.values(castById).find(x => x.name === name || (x.aliases || []).includes(name));
    return c && PORTRAITS.has(c.id) ? c.id : "";
  };
  const initial = n => esc([...plain(n || "?")][0] || "?");
  const avatar = (who, name, me, line, size) => {
    const id = idOf(who, name, me), c = person(id), st = size ? `width:${size}px;height:${size}px;` : "";
    if (id) return `<img class="ava" src="icons/${line ? "line" : "cast"}/${id}.svg" alt="" style="${st}${c && c.color ? `--ringc:${c.color}` : ""}">`;
    return `<span class="ava" style="${st}">${initial(name)}</span>`;
  };
  const sticker = (id, extra) => { const s = STK[id]; if (!s) return ""; return `<button class="stk" data-sinfo="${esc(id)}"><img src="${esc(s.img)}" alt=""><b>${esc(s.text)}</b>${extra || ""}</button>`; };
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-sinfo]"); if (!b || b.closest(".sgrid")) return;
    const s = STK[b.dataset.sinfo]; if (s) toast(`${s.text} (${s.reading}): ${s.en}`);
  });

  /* ---------- steps: 聞く · わかる · 覚える · 使う ---------- */
  let warmQueue = [];
  const LIST_JP = {voicemail:"留守電", announcement:"アナウンス", dictation:"書き取り", ladder:"ゆっくり→ふつう"};
  function buildSteps(L){
    if (L.format === "mock") return [{type:"intro", tab:"出発", jp:"模試"}, {type:"mock", tab:"模試", jp:"問題"}, {type:"done", tab:"終点", jp:"お疲れ様"}];
    const s = [{type:"intro", tab:"出発", jp:"今日のレッスン"}];
    const latest = lessons.length && L.id === lessons[lessons.length - 1].id;
    warmQueue = latest ? dueToday().slice(0, WARM_MAX) : [];
    if (warmQueue.length) s.push({type:"warm", tab:"復習", jp:"ウォームアップ"});
    if (L.dialogue?.length) s.push({type:"dialogue", tab:"聞く", jp:FMT[fmtOf(L)].jp});
    if (L.listening && L.listening.type) s.push({type:"listening", tab:"聞く", jp:LIST_JP[L.listening.type] || "リスニング"});
    if (L.phrases?.length) s.push({type:"phrases", tab:"わかる", jp:"フレーズ"});
    if (L.grammar) s.push({type:"grammar", tab:"わかる", jp:"文法"});
    if (L.vocab?.length) s.push({type:"words", tab:"覚える", jp:"単語"});
    if (L.kanji || L.kanji_study?.length) s.push({type:"kanji", tab:"覚える", jp:"漢字"});
    if (L.challenge) s.push({type:"challenge", tab:"使う", jp:"チャレンジ"});
    s.push({type:"done", tab:"終点", jp:"お疲れ様"});
    if (L.tip || (L.extras || []).length) s.push({type:"more", tab:"おまけ", jp:"ヒントとおまけ"});
    return s;
  }
  function castCard(L){
    const people = (L.cast || []).map(id => person(id)).filter(Boolean);
    if (L.guest) people.push({name:L.guest.name, name_jp:L.guest.name_jp || "", role:"Guest · " + (L.guest.role || "")});
    if (!people.length) return "";
    return `<div class="card cast"><div class="label">Who's in it</div>${people.map(c => `<div class="who-row">
        ${c.id ? avatar(c.id, c.name) : `<span class="ava">${initial(c.name)}</span>`}
        <div style="min-width:0"><div style="font-weight:700;font-family:var(--jp)">${esc(c.name)}${c.name_jp && plain(c.name_jp) !== c.name ? ` <span class="note">${ruby(c.name_jp)}</span>` : ""}</div><div class="r">${esc(c.role || "")}</div></div>
      </div>`).join("")}</div>`;
  }

  /* ---- main text: tap = ▶ 🐢 ☆ under the line, double-tap = English ---- */
  const iconRow = (L, i, line) => `<div class="icons">${line.sticker ? "" : `<button data-play="d${i}|${esc(plain(line.jp))}" aria-label="Play">▶</button><button data-play="d${i}|${esc(plain(line.jp))}" data-slow="1" aria-label="Slow">🐢</button>`}${starBtn("l:" + L.id + ":d" + i, lineDef(L, line, "d" + i)).replace('class="star', 'class="star sm')}</div>`;
  const wave = () => `<span class="wave">${[8,14,20,12,18,22,10,16,20,9,14,18,12,7,15].map(h => `<i style="height:${h}px"></i>`).join("")}</span>`;
  function lineInner(L, d, i){
    if (d.sticker && STK[d.sticker]) return sticker(d.sticker);
    if (d.kind === "voice") return `<div class="vmsg"><button class="star" data-play="d${i}|${esc(plain(d.jp))}" aria-label="Play">▶</button>${wave()}<button class="mini" data-vtx="${i}">文字にする</button></div><div class="bubble" data-show="${i}" hidden><div class="jp-mid">${ruby(d.jp)}</div><div class="en hid" data-en="${i}">${esc(d.en)}</div></div>`;
    return `<div class="bubble" data-show="${i}" role="button" tabindex="0"><div class="jp-mid">${ruby(d.jp)}</div><div class="en hid" data-en="${i}">${esc(d.en)}</div></div>`;
  }
  function chatLine(L, d, i, opts = {}){
    const first = !d.me && (i === 0 || L.dialogue[i - 1].me || L.dialogue[i - 1].speaker !== d.speaker);
    return `<div class="line ${d.me ? "me" : ""}" data-li="${i}">
      ${d.me ? "" : first ? avatar(d.who, d.speaker, false, true) : `<span style="width:30px;flex:none"></span>`}
      <div class="stack">${!d.me && first ? `<span class="who" style="padding:0 4px">${esc(d.speaker)}</span>` : ""}${lineInner(L, d, i)}<div class="icons-slot"></div></div>
      <span class="side">${d.me && opts.read ? `<span class="kidoku">既読</span>` : ""}${d.time ? `<span>${esc(d.time)}</span>` : ""}</span></div>`;
  }
  function renderMain(L){
    const f = fmtOf(L), setting = L.dialogue_setting ? `<p class="note" style="margin:0">${ruby(L.dialogue_setting)}</p>` : "";
    const hint = `<p class="note" style="margin:0">Tap a line for ▶ 🐢 ☆. Double-tap for English.</p>`;
    if (f === "line"){
      const others = [...new Set(L.dialogue.filter(d => !d.me).map(d => d.who))];
      const head = others.length === 1 ? `${avatar(others[0], L.dialogue.find(d => !d.me).speaker, false, true, 26)}<span>${esc(L.dialogue.find(d => !d.me).speaker)}</span>` : esc([...new Set(L.dialogue.filter(d => !d.me).map(d => d.speaker))].join(", "));
      const live = !store.get("chat:" + L.id, false);
      return `<div class="step">${setting}
        <div class="chat"><div class="chat-head">${head}</div><div class="chat-head" style="font-weight:600">${esc(dateJP(L.id))}</div><div id="chatBody" style="display:flex;flex-direction:column;gap:8px">${live ? "" : L.dialogue.map((d, i) => chatLine(L, d, i, {read:true})).join("")}</div></div>
        ${live ? `<div class="chat-ctl" id="chatCtl"><button class="btn primary" id="chatGo">▶ Start the chat</button><button class="btn ghost" id="chatAll">Show all</button></div>` : `<div class="chat-ctl"><button class="btn ghost" id="chatGo">▶ Replay</button><button class="btn ghost" id="playAll">${ICON_SAY} Read aloud</button></div>`}
        ${hint}</div>`;
    }
    if (f === "story"){
      const tellers = [...new Set(L.dialogue.map(d => d.speaker))];
      return `<div class="step">${setting}
        <div class="card story"><div class="tellers">${L.dialogue.filter((d, i, a) => a.findIndex(x => x.speaker === d.speaker) === i).map(d => avatar(d.who, d.speaker, d.me)).join("")}<span class="label">Told by ${esc(tellers.join(" & "))}</span></div>
        ${L.dialogue.map((d, i) => `<div class="para line" data-li="${i}">
          ${tellers.length > 1 && (i === 0 || L.dialogue[i-1].speaker !== d.speaker) ? `<div class="para-who">${avatar(d.who, d.speaker, d.me)}${esc(d.speaker)}</div>` : ""}
          <div class="bubble" data-show="${i}" style="background:none;padding:0;max-width:100%"><div class="jp-mid">${ruby(d.jp)}</div><div class="en hid" data-en="${i}">${esc(d.en)}</div></div><div class="icons-slot"></div></div>`).join("")}</div>
        <button class="btn ghost" id="playAll">${ICON_SAY} Listen to the whole story</button>${hint}</div>`;
    }
    if (f === "text"){
      return `<div class="step">${setting}
        <div class="notice"><div class="notice-head">${ruby(L.text_title || "お知らせ")}</div>
        ${L.dialogue.map((d, i) => `<div class="part line" data-li="${i}"><span class="plabel">${esc(d.speaker)}</span>
          <div class="bubble" data-show="${i}" style="background:none;padding:0;max-width:100%"><div class="jp-mid">${ruby(d.jp)}</div><div class="en hid" data-en="${i}">${esc(d.en)}</div></div><div class="icons-slot"></div></div>`).join("")}</div>
        <button class="btn ghost" id="playAll">${ICON_SAY} Read it aloud</button>${hint}</div>`;
    }
    return `<div class="step">${setting}
        <div class="lines">${L.dialogue.map((d, i) => `
          <div class="line ${d.me ? "me" : ""}" data-li="${i}">
            <span class="who">${d.me ? "" : avatar(d.who, d.speaker)}${esc(d.speaker)}${d.me ? avatar("you", "", true) : ""}</span>
            ${lineInner(L, d, i)}<div class="icons-slot"></div>
          </div>`).join("")}
        </div>
        <button class="btn ghost" id="playAll">${ICON_SAY} Play whole dialogue</button>${hint}
      </div>`;
  }
  let lastTap = {i:-1, t:0};
  function wireMain(L){
    const stage = $("stage");
    stage.onclick = e => {
      if (e.target.closest("[data-play],[data-star],.gl,ruby,[data-sinfo]")) return;
      const vt = e.target.closest("[data-vtx]");
      if (vt){ const b = stage.querySelector(`.bubble[data-show="${vt.dataset.vtx}"]`); b.hidden = false; vt.remove(); return; }
      const bub = e.target.closest(".bubble[data-show]"); if (!bub) return;
      const i = +bub.dataset.show, now = Date.now();
      if (lastTap.i === i && now - lastTap.t < 330){ stage.querySelector(`[data-en="${i}"]`)?.classList.toggle("hid"); lastTap = {i:-1, t:0}; return; }
      lastTap = {i, t:now};
      const line = bub.closest("[data-li]"), slot = line.querySelector(".icons-slot"), open = bub.classList.contains("sel");
      stage.querySelectorAll(".bubble.sel").forEach(x => x.classList.remove("sel"));
      stage.querySelectorAll(".icons-slot").forEach(x => { x.innerHTML = ""; });
      if (!open){ bub.classList.add("sel"); slot.innerHTML = iconRow(L, i, L.dialogue[i]); }
    };
    const pa = $("playAll"); if (pa) pa.onclick = () => playChain(L.id, L.dialogue.filter(d => !d.sticker).map(d => [`d${L.dialogue.indexOf(d)}`, plain(d.jp)]));
    if (fmtOf(L) === "line"){
      const go = $("chatGo"), all = $("chatAll");
      if (go) go.onclick = () => liveChat(L);
      if (all) all.onclick = () => { stopAll(); store.set("chat:" + L.id, true); $("chatBody").innerHTML = L.dialogue.map((d, i) => chatLine(L, d, i, {read:true})).join(""); $("chatCtl").innerHTML = `<button class="btn ghost" id="chatGo">▶ Replay</button>`; $("chatGo").onclick = () => liveChat(L); };
    }
  }
  // C2: messages arrive one by one, with typing dots, 既読 and their audio
  async function liveChat(L){
    stopAll(); const run = playRun, body = $("chatBody"); if (!body) return;
    body.innerHTML = ""; const ctl = $("chatCtl"); if (ctl) ctl.innerHTML = `<button class="btn ghost" id="chatAll2">Show all</button>`;
    const skip = $("chatAll2"); if (skip) skip.onclick = () => { stopAll(); store.set("chat:" + L.id, true); body.innerHTML = L.dialogue.map((d, i) => chatLine(L, d, i, {read:true})).join(""); ctl.innerHTML = `<button class="btn ghost" id="chatGo">▶ Replay</button>`; $("chatGo").onclick = () => liveChat(L); };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const sc = () => { const st = $("stage"); st.scrollTop = st.scrollHeight; };
    for (let i = 0; i < L.dialogue.length; i++){
      if (run !== playRun) return;
      const d = L.dialogue[i];
      if (!d.me){
        const ty = document.createElement("div"); ty.className = "line"; ty.innerHTML = `${avatar(d.who, d.speaker, false, true)}<span class="typing"><i></i><i></i><i></i></span>`;
        body.appendChild(ty); sc(); await wait(900); ty.remove(); if (run !== playRun) return;
        const prev = [...body.querySelectorAll(".line.me .side")].pop(); if (prev && !prev.querySelector(".kidoku")) prev.insertAdjacentHTML("afterbegin", `<span class="kidoku">既読</span>`);
      } else await wait(500);
      body.insertAdjacentHTML("beforeend", chatLine(L, d, i)); body.lastElementChild.classList.add("step"); sc();
      if (!d.sticker && d.kind !== "voice") await playOne(L.id, [`d${i}`, plain(d.jp)], false, run); else await wait(900);

    }

  /* ---- challenge: pick · order · fix · sticker · write; always skippable ---- */

  /* ---- mock exam (once a month) ---- */

          box.innerHTML = `${head}<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="note">${ruby(q.prompt || "つぎの文の ★ に入る最もよいものを選びなさい。")}</div>
            <div class="slots">${ruby(o.before || "")}${[0,1,2,3].map(i => `<span class="s ${i === o.star ? "star" : ""}">${picked[i] != null ? esc(plain(o.pieces[picked[i]])) : i === o.star ? "★" : ""}</span>`).join("")}${ruby(o.after || "")}</div>
            <div class="tiles-in">${o.shown.map(i => `<button data-p="${i}" ${picked.includes(i) ? "disabled" : ""}>${esc(plain(o.pieces[i]))}</button>`).join("")}</div></div><div class="qafter"></div>`;
          box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { picked.push(+b.dataset.p); if (picked.length === 4){ const ok = picked[o.star] === o.star; tally(ok); draw(); box.querySelector(".qafter").innerHTML = `<div class="card"><b style="color:${ok ? "var(--good)" : "var(--stamp)"}">${ok ? "正解！" : "おしい！"}</b> ★ = ${esc(plain(o.pieces[o.star]))}. ${q.explain ? ruby(q.explain) : ""}</div><button class="btn primary" style="width:100%">Next</button>`; box.querySelector(".qafter .btn").onclick = next; } else draw(); });
        };

      if (q.listen){ sub.insertAdjacentHTML("beforebegin", `<button class="btn ghost" data-play="${esc(q.listen)}">▶ Listen</button>`); }
      if (q.text) sub.insertAdjacentHTML("beforebegin", `<div class="card"><div class="jp-mid">${ruby(q.text)}</div></div>`);
      runQuiz(sub, [{ask:"", prompt:`<span style="font-size:19px;font-weight:600">${ruby(q.prompt)}</span>`, options:q.options.map(plain), jpo:true, onRight:() => tally(true), onWrong:() => tally(false), note:q.explain ? ruby(q.explain) : ""}], () => next());

  }

  function wireStep(st){

  /* ---------- review cards: four kinds, auto-graded where possible ---------- */
  const CTYPE = {listen:"聞く · listen", read:"読む · read", cloze:"穴埋め · fill the gap", reverse:"逆 · English → Japanese", meaning:"意味 · meaning", self:"思い出す · recall"};
  function cardType(c, deck){

  function runCards(box, W, title, onFinish){

      <p style="margin:0">${deck.length ? `Nothing is due today.${next ? ` Next card comes back ${esc(dateJP(next))}.` : ""}` : "Finish a lesson: its words, kanji and grammar come back here the next day."}</p></div>
      ${deck.length ? `<button class="btn ghost" id="prac" style="width:100%">Practice ${Math.min(10, deck.length)} random cards anyway</button>` : ""}`;
    if ($("prac")) $("prac").onclick = () => runCards(box, {queue:shuffle(deck).slice(0, 10), qi:0, ok:0, again:new Set(), practice:true}, "Practice", after);
  }
  function renderSaved(){
    const KINDS = [["star", "★ Starred"], ["all", "All"], ["word", "Words"], ["line", "Lines"], ["kanji", "Kanji"], ["grammar", "Grammar"]];
    let kind = "star";
    page("Review deck", "保存", `<div class="chips" id="sk">${KINDS.map(([k, n]) => `<button data-k="${k}" aria-pressed="${k === kind}">${n}</button>`).join("")}</div><div id="sl"></div>`);
    const row = c => {
      let main = "";
      if (c.kind === "kanji") main = `<div class="row" style="justify-content:flex-start;gap:12px"><span class="kbig" style="font-size:40px">${esc(c.kanji)}</span><div><div style="font-weight:600">${esc(c.meaning)}</div><div class="note" style="font-family:var(--jp)">${esc([c.on, c.kun].filter(Boolean).join(" · "))}</div></div></div>`;
      else if (c.kind === "line") main = `<div class="jp-mid" style="font-size:17px">${ruby(c.sent)}</div><div class="note">${esc(c.sentEn)}</div>`;
      else if (c.kind === "grammar") main = `<div class="jp-mid" style="font-weight:700">${ruby(c.pattern)}</div><div style="font-size:15px">${esc(c.meaning)}</div>`;
      else main = `<div class="row" style="justify-content:flex-start;gap:10px"><span class="jp-mid" style="line-height:1.8">${ruby(c.word)}</span><span style="font-size:15px">${esc(c.en)}</span></div>${c.sent ? `<div class="src" style="font-family:var(--jp);font-size:13px;color:var(--muted)">${highlight(c.sent, c.surface)}</div>` : ""}`;
      const when = c.isNew ? "New" : c.due <= todayStr() ? "Due now" : "Next " + dateJP(c.due);
      return `<div class="srow"><div style="min-width:0;flex:1">${main}<div class="note" style="font-size:12px;margin-top:2px">${esc(when)}${c.lesson ? ` · <a href="#${esc(c.lesson)}" style="color:inherit">from ${esc(dateJP(c.lesson))}</a>` : ""}</div></div>${starBtn(c.k, c)}</div>`;
    };
    const draw = () => {
      const cards = Object.values(getDeck()).filter(c => kind === "all" || (kind === "star" ? c.star : (c.kind || "word") === kind)).sort((a, b) => a.added < b.added ? 1 : -1);
      $("sl").innerHTML = cards.length ? `<div class="card">${cards.map(row).join("")}</div>` : `<p class="note" style="margin:0">${kind === "star" ? "Nothing starred. ☆ anything you want to see more often." : "Nothing here yet."}</p>`;
    };
    $("sk").onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; kind = b.dataset.k; $("sk").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); draw(); };
    draw();
  }
  function renderKanjiPage(){
    const ks = Object.entries(kstate()), groups = [2, 1, 0].map(l => [l, ks.filter(([, v]) => kLevel(v) === l)]);
    page("Kanji", "漢字", ks.length ? `<div class="card" style="display:flex;justify-content:space-around;text-align:center">${groups.map(([l, a]) => `<div><div style="font-size:24px;font-weight:800">${a.length}</div><div style="font-size:12px;font-weight:700;font-family:var(--jp)">${K_LABEL[l]}</div></div>`).join("")}</div>
      <p class="note" style="margin:0">見た = you studied it · 読めた = you passed its quiz · 覚えた = right in review 3 times in a row.</p>
      ${groups.filter(([, a]) => a.length).map(([l, a]) => `<div class="label" style="font-family:var(--jp)">${K_LABEL[l]}</div><div class="kgrid">${a.reverse().map(([k, v]) => `<div class="kcell s${l}"><div class="k">${esc(k)}</div><div class="m">${esc(v.meaning)}</div><div class="r">${esc([v.on, v.kun].filter(Boolean).join(" · "))}</div><div class="stt" style="font-family:var(--jp)">${K_LABEL[l]}</div></div>`).join("")}</div>`).join("")}`
      : `<div class="card"><h3 style="margin:0;font-size:20px">No kanji yet</h3><p style="margin:0">They show up after the 漢字 stop of a lesson.</p></div>`);
  }
  function renderLessons(){
    const byMonth = {};
    lessons.slice().reverse().forEach(l => { const d = new Date(l.id + "T12:00:00"), m = `${d.getFullYear()}年${d.getMonth() + 1}月`; (byMonth[m] = byMonth[m] || []).push(l); });
    page("All lessons", "線", Object.entries(byMonth).map(([m, ls]) => `<div class="label" style="font-family:var(--jp)">${esc(m)}</div><div class="card">${ls.map(lessonRow).join("")}</div>`).join(""));
    fillTitles($("page"));
  }
  /* People: your LINE friends list */
  function renderPeople(){
    const log = window.__log || [], met = {}, last = {};
    log.forEach(e => (e.cast || []).forEach(c => { met[c] = met[c] || e.date; last[c] = e.date; }));
    const list = Object.values(castById).filter(c => c.id !== "hayato" || met.hayato);
    list.sort((a, b) => (met[b.id] ? 1 : 0) - (met[a.id] ? 1 : 0) || ((last[b.id] || "") < (last[a.id] || "") ? -1 : 1));
    page("People", "友だち", `<div class="card">${list.map(c => met[c.id] || c.id === "keiko" ? `<button class="frow" data-pp="${esc(c.id)}"><span class="ring" style="background:${esc(c.color || "transparent")}">${avatar(c.id, c.name, false, true, 44)}</span><span class="tx"><b>${esc(c.name)}</b><div>${c.status ? ruby(c.status) : "　"}</div></span></button>`
      : `<div class="frow locked"><span class="ava" style="width:48px;height:48px">?</span><span class="tx"><b>？？？</b><div>Not met yet</div></span></div>`).join("")}</div>`);
    $("page").onclick = e => {
      const b = e.target.closest("[data-pp]"); if (!b) return;
      const c = person(b.dataset.pp), facts = log.flatMap(x => (x.new_facts || []).filter(f => f.includes(c.name) || (c.aliases || []).some(a => f.includes(a)))).slice(-6);
      openSheet(`<div class="row" style="justify-content:flex-end"><button class="icon-btn" data-close aria-label="Close">✕</button></div>
        <div class="prof"><span class="ring" style="background:${esc(c.color || "transparent")}">${avatar(c.id, c.name, false, true, 84)}</span><h2 style="margin:0;font-family:var(--jp)">${esc(c.name)}</h2><div class="note" style="font-family:var(--jp)">${ruby(c.name_jp || "")}</div>${c.status ? `<div class="jp-mid">「${ruby(c.status)}」</div>` : ""}</div>
        <div class="card"><table class="dtab"><tr><td>Who</td><td>${esc(c.role || "")}</td></tr>${c.where ? `<tr><td>Where</td><td style="font-family:var(--jp)">${ruby(c.where)}</td></tr>` : ""}${met[c.id] ? `<tr><td>Met</td><td>${esc(dateJP(met[c.id]))}</td></tr><tr><td>Last seen</td><td>${esc(dateJP(last[c.id]))}</td></tr>` : ""}</table></div>
        ${facts.length ? `<div class="card"><div class="label">What you know</div><ul class="facts">${facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}`);
    };
  }

  /* settings */
  const THEMES = [["auto", "Auto"], ["light", "Light ☀︎"], ["dark", "Dark ☾"]];
  const SERIF = '"Hiragino Mincho ProN","Noto Serif JP",serif', SANS = '"Hiragino Sans","Noto Sans JP",system-ui,sans-serif', MARU = '"Hiragino Maru Gothic ProN",' + SANS;
  const DFONTS = [["tokumin", "Tokumin", "Kaisei Tokumin", "700", SERIF], ["shantique", "Shippori Antique", "Shippori Antique", "", SANS], ["boku", "Boku", "Yuji Boku", "", SERIF], ["yusei", "Magic marker", "Yusei Magic", "", SANS], ["kurenaido", "Kurenaido", "Zen Kurenaido", "", SANS], ["round", "Zen Maru", "Zen Maru Gothic", "700", MARU], ["kiwi", "Kiwi", "Kiwi Maru", "500", MARU], ["hachi", "Hachi Pop", "Hachi Maru Pop", "", MARU], ["reggae", "Reggae", "Reggae One", "", SANS], ["rampart", "Rampart", "Rampart One", "", SANS], ["dot", "Pixel", "DotGothic16", "", SANS], ["same", "Same as text", "", "", ""]];
  const TFONTS = [["klee", "Textbook", "Klee One", "400;600", SERIF], ["boku", "Boku", "Yuji Boku", "", SERIF], ["kaku", "Zen Kaku", "Zen Kaku Gothic New", "400;500;700", SANS], ["sawagot", "Sawarabi", "Sawarabi Gothic", "", SANS], ["system", "Phone", "", "", SANS], ["round", "Zen Maru", "Zen Maru Gothic", "400;500;700", MARU], ["kiwi", "Kiwi", "Kiwi Maru", "400;500", MARU], ["kosugimaru", "Kosugi Maru", "Kosugi Maru", "", MARU]];
  const PAIRS = [["textbook", "教科書", "klee", "tokumin"], ["modern", "モダン", "kaku", "tokumin"], ["hand", "手書き", "round", "yusei"]];
  const DEF_T = "kaku", DEF_D = "tokumin";
  const findF = (list, id, def) => list.find(f => f[0] === id) || list.find(f => f[0] === def);
  const gq = (fam, w) => "family=" + fam.replace(/ /g, "+") + (w ? ":wght@" + w : "");
  const stackOf = f => f[2] ? `"${f[2]}",${f[4]}` : f[4];
  const SELF = new Set(["Zen Kaku Gothic New", "Kaisei Tokumin"]);  // self-hosted (fonts/), never from Google
  function loadFontCss(q){ const href = "https://fonts.googleapis.com/css2?" + q + "&display=swap"; if (document.querySelector(`link[data-f="${CSS.escape(href)}"]`)) return; const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; l.dataset.f = href; document.head.appendChild(l); }
  function applySettings(){
    const R = document.documentElement, th = store.get("set:theme", "auto");
    if (th === "auto") R.removeAttribute("data-theme"); else R.setAttribute("data-theme", th);
    const t = findF(TFONTS, store.get("set:font", DEF_T), DEF_T), d = findF(DFONTS, store.get("set:dfont", DEF_D), DEF_D), ui = store.get("set:uifont", "inter");
    const jp = t[0] === "system" ? '"Hiragino Sans","Noto Sans CJK JP",system-ui,sans-serif' : stackOf(t);
    const vars = {"--jp":jp, "--ui":ui === "match" ? jp : '"Inter Tight",' + jp, "--mincho":d[0] === "same" ? jp : stackOf(d), "--fs":String(store.get("set:size", 18) / 18)};
    const links = [t, d].filter(f => f[2] && !SELF.has(f[2])).map(f => gq(f[2], f[3]));
    Object.entries(vars).forEach(([k, v]) => R.style.setProperty(k, v)); links.forEach(loadFontCss);
    store.set("set:css", {vars, links}); if (window.__themeColor) window.__themeColor();
  }
  function renderSettings(){
    const th = store.get("set:theme", "auto"), tId = findF(TFONTS, store.get("set:font", DEF_T), DEF_T)[0], dId = findF(DFONTS, store.get("set:dfont", DEF_D), DEF_D)[0], ui = store.get("set:uifont", "inter"), size = store.get("set:size", 18);
    const pair = (PAIRS.find(p => p[2] === tId && p[3] === dId) || [])[0];
    const grid = (key, list, cur, sample, weight) => `<div class="fontgrid" data-set="${key}">${list.map(f => `<button data-v="${f[0]}" aria-pressed="${f[0] === cur}"><b style="font-family:${f[0] === "same" ? "var(--jp)" : f[0] === "system" ? "system-ui,sans-serif" : esc(`"${f[2]}"`)};font-weight:${weight}">${sample}</b><small>${esc(f[1])}</small></button>`).join("")}</div>`;
    const deck = Object.values(getDeck()), act = Object.keys(activity()).length, answers = Object.keys(localStorage).filter(k => k.startsWith("answer:")).length;
    page("Settings", "設定", `<div class="preview" id="preview"><div class="pv-top"><div style="min-width:0"><div class="pv-title">${APP_TITLE[0]}</div><div class="pv-sub">${esc(APP_TITLE[1])}</div></div><div class="pv-k">語</div></div>
        <div class="pv-line jp-mid">${ruby("{今日|きょう}はいい{天気|てんき}ですね。{散歩|さんぽ}する？")}</div><div class="pv-en">Lovely weather today. Want to go for a walk?</div></div>
      <div class="card" id="settings">
        <div class="set-row"><div class="lab">Theme<span>画面</span></div><div class="seg" data-set="theme">${THEMES.map(([k, n]) => `<button data-v="${k}" aria-pressed="${k === th}">${n}</button>`).join("")}</div></div>
        <div class="set-row"><div class="lab">Fonts<span>書体</span></div><div class="pairs" data-set="pair">${PAIRS.map(p => { const tf = findF(TFONTS, p[2]); return `<button data-v="${p[0]}" aria-pressed="${pair === p[0]}"><b style="font-family:${esc(stackOf(tf))}">日本語</b>${p[1]}</button>`; }).join("")}</div>
          <details class="more"><summary>More fonts</summary><div class="fgroup">Titles &amp; big kanji</div>${grid("dfont", DFONTS, dId, "漢字", 700)}<div class="fgroup">Text</div>${grid("font", TFONTS, tId, "日本語<i>Aa</i>", 400)}
          <div class="fgroup">English letters</div><div class="seg" data-set="uifont">${[["inter", "Inter"], ["match", "Same as Japanese"]].map(([k, n]) => `<button data-v="${k}" aria-pressed="${k === ui}">${n}</button>`).join("")}</div></details></div>
        <div class="set-row"><div class="lab">Text size<span id="szv">${size}px</span></div><input type="range" id="size" min="15" max="22" value="${size}" style="accent-color:var(--accent)"></div>
        <div class="set-row"><div class="lab">Furigana<span>ふりがな</span></div><div class="seg" data-set="furi">${[["on", "Show"], ["adaptive", "Adaptive"], ["off", "Hide"]].map(([k, n]) => `<button data-v="${k}" aria-pressed="${furiMode === k}">${n}</button>`).join("")}</div>
          <p class="note" style="margin:0">Adaptive hides furigana only on N5/N4 kanji whose reading you got right 3 times in a row (or marked 100% known when you tap the word). Tap to peek.</p></div>
        <div class="set-row"><div class="lab">Beta: speak the phrases<span>🎤</span></div><div class="seg" data-set="speak"><button data-v="on" aria-pressed="${store.get("set:speak", false)}">On</button><button data-v="off" aria-pressed="${!store.get("set:speak", false)}">Off</button></div>
          <p class="note" style="margin:0">Adds a 🎤 to phrase cards: your phone's speech recognition writes what it heard and shows what didn't come through.</p></div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="lab" style="font-weight:600;display:flex;justify-content:space-between">Your data<span class="note">on this phone only</span></div>
        <table class="dtab"><tr><td>Review deck</td><td>${deck.length} cards · ${deck.filter(c => c.star).length} ★</td></tr><tr><td>Study days</td><td>${act}</td></tr><tr><td>Challenge answers</td><td>${answers}</td></tr><tr><td>Lessons done</td><td>${Object.keys(doneMap()).length}</td></tr><tr><td>Last backup</td><td>${esc(store.get("lastExport", "never"))}</td></tr></table>
        <p class="note" style="margin:0">Nothing leaves your phone. If you change phones or clear Safari, it's lost: export a backup now and then.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn primary" id="exp">Export</button><label class="btn ghost" style="cursor:pointer">Import<input type="file" id="imp" accept="application/json,.json" hidden></label></div>
        <button class="btn ghost" id="wipe" style="color:var(--stamp)">Erase everything</button></div>
      <p style="font-size:12px;opacity:.6;margin:14px 4px">Voices: Google Gemini 3.8 Flash-Lite TTS · VOICEVOX:白上虎太郎 · Stickers: Microsoft Fluent Emoji (MIT) · Kanji data: KANJIDIC (EDRDG, CC BY-SA)</p>`);
    const box = $("settings");
    box.onclick = e => {
      const b = e.target.closest("[data-v]"), g = b && b.closest("[data-set]"); if (!b || !g) return;
      const k = g.dataset.set, v = b.dataset.v;
      if (k === "furi"){ furiMode = v; store.set("furiMode", v); applyFuri(); }
      else if (k === "speak") store.set("set:speak", v === "on");
      else if (k === "pair"){ const p = PAIRS.find(x => x[0] === v); store.set("set:font", p[2]); store.set("set:dfont", p[3]); applySettings(); renderSettings(); return; }
      else { store.set("set:" + k, v); applySettings(); }
      box.querySelectorAll(`[data-set="${k}"] [data-v]`).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    };
    $("size").oninput = e => { store.set("set:size", +e.target.value); $("szv").textContent = e.target.value + "px"; applySettings(); };
    $("exp").onclick = () => {
      const data = {}; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); data[k] = localStorage.getItem(k); }
      const blob = new Blob([JSON.stringify({app:"ichinichi-ippo", date:new Date().toISOString(), data}, null, 1)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ichinichi-ippo-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
      store.set("lastExport", todayStr()); toast("Backup saved");
    };
    $("imp").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try{ const j = JSON.parse(await f.text()); if (!j.data) throw 0; Object.entries(j.data).forEach(([k, v]) => localStorage.setItem(k, v)); toast("Backup restored"); setTimeout(() => location.reload(), 600); }
      catch{ toast("That file isn't a backup from this app"); }
    };
    let armed = false;
    $("wipe").onclick = () => { if (!armed){ armed = true; $("wipe").textContent = "Tap again to erase everything"; setTimeout(() => { armed = false; const w = $("wipe"); if (w) w.textContent = "Erase everything"; }, 3000); return; } localStorage.clear(); location.reload(); };
  }

  /* ---------- data ---------- */
  const cache = {}, raw = {};
  const getJSON = id => raw[id] || (raw[id] = fetch("lessons/" + id + ".json", {cache:"no-cache"}).then(r => { if (!r.ok) throw new Error("missing"); return r.json(); }).then(L => { L.id = id; return L; }).catch(e => { delete raw[id]; throw e; }));
  async function loadLesson(id){ if (cache[id]) return cache[id]; const L = await getJSON(id); cache[id] = L; await loadAudio(id); return L; }

  /* offline: keep the last 7 lessons with their audio on the phone (service worker cache) */
  async function precache(){
    if (!("serviceWorker" in navigator) || !navigator.onLine) return;
    const last = store.get("offline", null); if (last && last.d === todayStr() && last.top === lessons[lessons.length - 1]?.id) return;
    const reg = await navigator.serviceWorker.ready.catch(() => null); if (!reg || !reg.active) return;
    const ids = lessons.slice(-7).map(l => l.id), urls = ["./", "index.html", "cast.json", "topics.json", "stickers.json", "lessons/index.json", "data/kanji.json", "manifest.webmanifest"];
    for (const id of ids){
      urls.push("lessons/" + id + ".json", "audio/" + id + ".json");
      const m = await loadAudio(id);
      Object.entries(m).forEach(([k, v]) => { if (typeof v === "string" && /\.mp3$/.test(v) && (k !== "_radio" || id === ids[ids.length - 1])) urls.push(v); });
    }
    Object.values(STK).forEach(s => urls.push(s.img));
    Object.values(getDeck()).forEach(c => { if (c.lesson && !ids.includes(c.lesson)) urls.push("audio/" + c.lesson + ".json"); });
    reg.active.postMessage({type:"precache", urls:[...new Set(urls)]});
    store.set("offline", {d:todayStr(), n:ids.length, top:ids[ids.length - 1]});
  }

  applySettings();
  (async () => {
    try{
      try{ const cr = await fetch("cast.json", {cache:"no-cache"}); if (cr.ok){ const C = await cr.json(); [...C.cast, ...(C.others || [])].forEach(c => { castById[c.id] = c; }); window.__log = C.log || []; } }catch{}
      try{ const sr = await fetch("stickers.json", {cache:"no-cache"}); if (sr.ok) (await sr.json()).stickers.forEach(s => { STK[s.id] = s; }); }catch{}
      await kdLoad;
      const r = await fetch("lessons/index.json", {cache:"no-cache"}), list = await r.json(), today = todayStr();
      lessons = list.filter(l => l.id && l.topic && l.id <= today).sort((a, b) => a.id < b.id ? -1 : 1);
      route();
      setTimeout(precache, 4000);
    }catch{ showEmpty("Can't load lessons", "Check your connection and reopen the app."); }
  })();
  if ("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch{} }
})();

</script>
