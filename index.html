<meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}html{background:#f2f3f5}@media (prefers-color-scheme:dark){html{background:#000}}html[data-theme="dark"]{background:#000}html[data-theme="light"]{background:#f2f3f5}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Nihongo Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Kaisei+Tokumin:wght@700&display=swap">
<style>
/* Layout: one-screen phone app. Gradient "station board" hero card, a slim progress line of stops, big rounded cards on a soft canvas, pill buttons in the thumb zone. Fintech-clean, bold type. */
:root{
  --paper:#f2f3f5; --card:#ffffff; --ink:#111316; --muted:#6b717c; --rule:#e3e5e9; --soft:#eef1f6;
  --accent:#4f46e5; --accent-2:#2563eb; --on-accent:#ffffff; --good:#0ea56b;
  --grad:linear-gradient(135deg,#2b59ff 0%,#6d3cf5 55%,#d946ef 100%);
  --btn:#111316; --on-btn:#ffffff; --ghost:#e6e8ec;
  --stamp:#e5484d; --polite:#2563eb; --casual:#d9480f;
  --ui:"Inter Tight","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Kaisei Tokumin","Hiragino Mincho ProN","Noto Serif JP",serif;
  --line:var(--accent); --line-ink:var(--on-accent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#000000; --card:#16171b; --ink:#f5f6f8; --muted:#9298a3; --rule:#26282e; --soft:#1e2028;
  --accent:#7c74ff; --accent-2:#5b8cff; --on-accent:#ffffff;
  --btn:#f5f6f8; --on-btn:#000000; --ghost:#24262c;
  --stamp:#ff6369; --polite:#7aa2ff; --casual:#ff8a4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#000000; --card:#16171b; --ink:#f5f6f8; --muted:#9298a3; --rule:#26282e; --soft:#1e2028;
  --accent:#7c74ff; --accent-2:#5b8cff; --on-accent:#ffffff;
  --btn:#f5f6f8; --on-btn:#000000; --ghost:#24262c;
  --stamp:#ff6369; --polite:#7aa2ff; --casual:#ff8a4c; color-scheme:dark}

/* font setting (Settings on the home screen) */
/* never fake a bold: Brush and Bold title fonts come in one weight */
html{font-synthesis-weight:none}
/* scroll without a visible bar */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.date-btn{font-size:14px;font-weight:600;color:var(--ink);padding:7px 12px;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:999px;white-space:nowrap;min-width:0;overflow:hidden}
.date-btn #dateLabel{overflow:hidden;text-overflow:ellipsis}
.today-dot{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);padding:2px 7px;border-radius:999px}
.date-btn svg{width:15px;height:15px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;white-space:nowrap;flex:none}
.pill{width:40px;height:24px;border-radius:12px;background:var(--ghost);position:relative;transition:background .2s}
.pill::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-pressed="true"] .pill{background:var(--accent)}
.toggle[aria-pressed="true"] .pill::after{transform:translateX(16px)}

/* station board = gradient hero card */
.board{background:var(--grad);color:#fff;border-radius:24px;overflow:hidden;position:relative}
.board::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.board-main{text-align:left;padding:10px 16px 2px;position:relative;z-index:1}
.board-kicker{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.board-title{font-family:var(--ui);font-size:clamp(18px,5.2vw,22px);font-weight:700;line-height:1.25;letter-spacing:-.01em;text-wrap:balance;margin-top:2px}
.board-title rt{color:rgba(255,255,255,.75)}
.board-en{font-size:12px;opacity:.85;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px 9px;font-size:12px;font-weight:600;position:relative;z-index:1}
.band .prev,.band .next{display:flex;min-width:0;flex:1}
.band .next{justify-content:flex-end}
.band span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:999px;max-width:100%}
.band .num{flex:none;background:#fff;color:#2b2bd9;font-weight:700;border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;font-size:12px}

/* progress line */
.stops{--edge:8px;display:flex;align-items:center;height:16px;margin-top:6px;position:relative}
.stops::before{content:"";position:absolute;left:var(--edge);right:var(--edge);top:50%;height:3px;border-radius:2px;background:var(--ghost);transform:translateY(-50%)}
.stops .fill{position:absolute;left:var(--edge);top:50%;height:3px;border-radius:2px;background:var(--accent);transform:translateY(-50%);transition:width .3s}
.stop{flex:1;display:flex;justify-content:center;align-items:center;height:16px;position:relative;z-index:1}
.stop i{width:7px;height:7px;border-radius:50%;background:var(--ghost);display:block;transition:all .2s}
.stop.done i{background:var(--accent)}
.stop.here i{background:var(--card);width:9px;height:9px;box-shadow:0 0 0 2.5px var(--accent)}

/* stage */
.stage{flex:1;overflow-y:auto;padding-block:10px 8px;min-height:0;-webkit-overflow-scrolling:touch}
.step{display:flex;flex-direction:column;gap:10px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.pill::after,.stops .fill{transition:none}}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:20px;padding:16px}

ruby{ruby-position:over}
rt{font-size:.5em;color:var(--muted);font-weight:500;letter-spacing:0;transition:opacity .15s}
.furi-off rt{opacity:0}
.furi-off ruby.peek rt{opacity:1}
.furi-off ruby{cursor:pointer;border-bottom:1px dotted var(--muted)}
/* hard words: underlined, tap for meaning */
.gl,.furi-off ruby.gl{cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--accent) 70%,transparent);border-radius:2px;-webkit-tap-highlight-color:transparent;transition:background .15s}
.gl.gl-on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-bottom-style:solid}
.gl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.line.me .gl{border-bottom-color:rgba(255,255,255,.8)}
.line.me .gl.gl-on{background:rgba(255,255,255,.22)}
.gpop{position:fixed;z-index:60;box-sizing:border-box;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px var(--rule);display:flex;flex-direction:column;gap:4px;animation:in .15s ease}
.gpop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gpop-w{font-family:var(--jp);font-size:22px;font-weight:700;line-height:1.3}
.gpop-r{font-family:var(--jp);font-size:14px;color:var(--muted)}
.gpop-m{font-size:16px;font-weight:600;line-height:1.35}

.jp-big{font-family:var(--jp);font-size:clamp(21px,6.4vw,26px);font-weight:700;line-height:1.95;word-break:keep-all;overflow-wrap:anywhere}
.jp-mid{font-family:var(--jp);font-size:18px;font-weight:500;line-height:2;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.02em;padding:5px 12px;border-radius:999px;background:var(--soft);text-transform:capitalize}
.chip.polite{color:var(--polite)} .chip.casual{color:var(--casual)} .chip.neutral{color:var(--muted)}
.chip.dialect{color:var(--good)} .chip.slang{color:#c026d3} .chip.archaic{color:#a16207}
.say{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);padding:8px 13px;border-radius:999px;background:var(--ghost)}
.say svg{width:15px;height:15px}
.reveal{width:100%;text-align:left;border-radius:16px;padding:13px 16px;color:var(--muted);font-size:15px;font-weight:600;background:var(--card);border:1.5px dashed var(--ghost)}
.reveal.open{border:1.5px solid transparent;background:var(--soft);color:var(--ink);font-weight:500}
.note{font-size:14px;color:var(--muted)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:600}

/* intro */
.agenda-row{display:flex;flex-wrap:wrap;gap:6px}
.agenda-row span{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--card);color:var(--ink)}
.bubble-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.bubble{cursor:pointer}
.play{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ghost);color:var(--ink);margin-top:6px}
.play svg{width:14px;height:14px}
.line.me .play{background:rgba(255,255,255,.22);color:#fff}
.lines .who{padding:0 8px}
.agenda{display:grid;gap:9px;list-style:none;padding:0;margin:0}
.agenda li{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:500}
.agenda b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-variant-numeric:tabular-nums;flex:none}

/* dialogue */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.line.me{align-items:flex-end}
.who{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.bubble{background:var(--card);border-radius:18px 18px 18px 6px;padding:6px 10px 6px 14px;max-width:90%;min-width:0}
.line.me .bubble{background:var(--grad);color:#fff;border-radius:18px 18px 6px 18px}
.line.me .bubble rt{color:rgba(255,255,255,.75)}
.bubble .en{font-size:13.5px;color:var(--muted);margin:2px 0 4px;padding-top:4px;border-top:1px solid var(--rule)}
.bubble .en.hid{display:none}
.line.me .bubble .en{color:rgba(255,255,255,.85);border-top-color:rgba(255,255,255,.25)}
.bubble .en.hid{color:transparent!important;background:var(--ghost);border-radius:6px;border-top-color:transparent;user-select:none}
.line.me .bubble .en.hid{background:rgba(255,255,255,.22)}
.bubble-tools{display:flex;gap:14px;margin-top:4px}
.mini{font-size:12px;font-weight:700;color:var(--accent);padding:4px 0}
.line.me .mini{color:#fff}

/* kanji sign */
.sign{background:var(--card);border-radius:24px;overflow:hidden;text-align:center}
.sign-top{padding:20px 12px 12px}
.sign-k{font-family:var(--mincho);font-size:clamp(52px,17vw,72px);line-height:1.1;letter-spacing:.06em}
.sign-r{font-size:18px;font-weight:600;color:var(--muted);margin-top:8px;min-height:1.6em}
.sign-bar{background:var(--grad);color:#fff;font-weight:700;padding:9px;font-size:13px;letter-spacing:.14em}

/* tip */
.tip h3{margin:0;font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.tip p{margin:0;font-size:16px}
.hanko{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--grad);color:#fff;font-family:var(--mincho);font-size:22px}

/* challenge */
textarea{width:100%;min-height:78px;resize:vertical;font-family:var(--jp);font-size:18px;line-height:1.6;padding:14px 16px;border:2px solid transparent;border-radius:20px;background:var(--card);color:var(--ink);box-sizing:border-box}
textarea:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16px}
.btn.primary{background:var(--btn);color:var(--on-btn)}
.btn.ghost{background:var(--ghost);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.fb{display:flex;flex-direction:column;gap:12px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700}
.fb .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* nav */
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:8px 12px}
.nav .btn{width:100%}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-height:70%;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.sheet h2{font-size:20px;font-weight:700;margin:0 0 8px}
.lesson-item{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--rule);font-weight:500}
.lesson-item small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lesson-item.cur{color:var(--accent);font-weight:700}

/* review: stars, cards, quiz */
.star{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-size:19px;line-height:1;color:var(--muted);background:var(--ghost)}
.star.on{color:#f5a524}
.line.me .star{background:rgba(255,255,255,.22);color:#fff}
.line.me .star.on{color:#ffd166}
mark{background:var(--soft);color:var(--accent);border-radius:5px;padding:0 3px;font-weight:700}
.line.me mark{background:rgba(255,255,255,.25);color:#fff}
.lvl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.lvl.N3,.lvl.N2,.lvl.N1{color:var(--accent)}
.vrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.vrow:last-child{border-bottom:0;padding-bottom:0}
.vrow:first-child{padding-top:0}
.vrow .src{font-family:var(--jp);font-size:13px;color:var(--muted);margin-top:2px}
.kbig{font-family:var(--mincho);font-size:64px;line-height:1.1}
.pad{display:flex;flex-direction:column;gap:8px;align-items:center}
.pad-box{position:relative;width:min(100%,300px);aspect-ratio:1;border-radius:16px;background:var(--soft);overflow:hidden;touch-action:none}
.pad-box .guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-size:min(220px,62vw);line-height:1;color:var(--ink);opacity:.12;pointer-events:none;user-select:none}
.pad-box .guide.off{opacity:0}
.pad-box svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--muted);opacity:.35}
.pad-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad-tools{display:flex;gap:8px;width:min(100%,300px)}
.pad-tools .btn{flex:1;white-space:nowrap;min-height:40px;padding:0 12px;font-size:14px}
.kread{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.kread b{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;padding:12px 16px;border-radius:14px;background:var(--card);font-weight:600;border:1.5px solid var(--ghost)}
.opt.jpo{font-family:var(--jp);font-size:18px}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--stamp);color:var(--stamp)}
.opt:disabled{cursor:default}
.qprompt{font-family:var(--jp);font-size:clamp(24px,7vw,30px);font-weight:700;line-height:1.5;text-align:center;padding:6px 0}
.qprompt.k{font-family:var(--mincho);font-size:60px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.good{background:var(--good);color:#fff}
.wsent{font-family:var(--jp);font-size:21px;font-weight:500;line-height:1.9;overflow-wrap:anywhere}

/* cast */
.cast{display:flex;flex-direction:column;gap:8px}
.who-row{display:flex;gap:10px;align-items:center}
.ava{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);font-family:var(--jp);font-weight:700;font-size:15px}
.who-row .r{font-size:13px;color:var(--muted)}

/* LINE chat */
.chat{background:var(--soft);border-radius:20px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.chat-head{font-size:13px;font-weight:700;text-align:center;color:var(--muted);padding:2px 0 4px}
.chat .line{flex-direction:row;align-items:flex-end;gap:6px}
.chat .line.me{flex-direction:row-reverse}
.chat .line .ava{width:36px;height:36px;font-size:13px;align-self:flex-start;background:var(--card)}
.chat .stack{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:82%}
.chat .line.me .stack{align-items:flex-end}
.chat .bubble{max-width:100%;border-radius:16px 16px 16px 4px}
.chat .line.me .bubble{background:#06c755;border-radius:16px 16px 4px 16px}
.chat .time{font-size:10.5px;color:var(--muted);flex:none;padding-bottom:2px}

/* story */
.story{display:flex;flex-direction:column;gap:4px}
.story .para{cursor:pointer;padding:6px 2px;border-bottom:1px solid var(--rule)}
.story .para:last-child{border-bottom:0}
.story .en{font-size:14px;color:var(--muted);margin-top:2px}
.story .en.hid{display:none}

/* real text */
.notice{background:var(--card);border-radius:8px;border:2px solid var(--ink);overflow:hidden}
.notice-head{background:var(--ink);color:var(--card);font-weight:700;font-size:13px;letter-spacing:.12em;padding:7px 14px;font-family:var(--jp)}
.notice .part{padding:10px 14px;border-bottom:1px dashed var(--rule);cursor:pointer}
.notice .part:last-child{border-bottom:0}
.notice .plabel{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.notice .en{font-size:14px;color:var(--muted);margin-top:2px}
.notice .en.hid{display:none}

/* grammar */
.gpat{font-family:var(--jp);font-size:clamp(24px,7vw,30px);font-weight:700;line-height:1.5}
.gsec{display:flex;flex-direction:column;gap:6px}
.gline{font-family:var(--jp);font-size:17px;line-height:1.9}
.gsec p{line-height:2.1}
.gsec p ruby{line-height:1}
.gform{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;margin:2px 0 0;padding:0;list-style:none}
.gform li{display:contents}
.gform .fl,.gform .fb{padding:10px 0;border-top:1px solid var(--rule)}
.gform li:first-child .fl,.gform li:first-child .fb{border-top:0;padding-top:2px}
.gform .fl{align-self:start}
.gform .fl span{display:inline-block;font-family:var(--jp);font-size:13px;font-weight:700;line-height:1.2;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.gform .fl ruby rt{font-size:8px}
.gform .fb{min-width:0}
.gform li.nolab .fb{grid-column:1 / -1}
.gform .fr{font-family:var(--jp);font-size:18px;font-weight:700;line-height:1.7}

/* avatars */

.who{display:inline-flex;align-items:center;gap:6px}

/* stroke order */

.order path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.order .ghost{stroke:var(--ink);opacity:.14;stroke-width:3}
.order .live{stroke:var(--accent);stroke-width:3.4}

.order .dot{fill:var(--stamp)}
.pad-order{display:flex;gap:8px;width:min(100%,300px)}
.pad-order .btn{flex:1;min-height:40px;font-size:14px;padding:0 10px;white-space:nowrap}

.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding-top:20px}
.empty h2{margin:0;font-size:22px;font-weight:700}

/* home + pages */
:where(.app) a{text-decoration:none;color:inherit}
.top-l{display:flex;align-items:center;gap:6px;min-width:0}
.icon-btn{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.home,.page{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-block:6px 20px;display:flex;flex-direction:column;gap:12px}
.faces{flex:none;display:flex;align-items:center;min-width:34px}
.faces img.ava,.faces .ava{width:34px;height:34px;box-shadow:0 0 0 2px var(--card)}
.faces > * + *{margin-left:-12px}
.faces .emo{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:19px;line-height:1}
.lrow .tx div{font-family:var(--jp)}
.lrow .st{width:22px;height:22px;font-size:11px}

.week .d{font-family:var(--jp);font-size:12.5px}
.set-row{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule)}

.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.fontgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--soft);color:var(--muted)}
.fontgrid button b{font-size:22px;line-height:1.3;color:var(--ink);font-weight:500}
.fontgrid button small{font-size:12px;font-weight:600;font-family:var(--ui)}
.fgroup{font-size:11.5px;font-weight:600;color:var(--muted);margin:6px 0 -2px;letter-spacing:.03em}
.fontgrid button i{font-style:normal;font-family:inherit;font-size:14px;margin-left:3px;color:var(--muted)}
.fontgrid[data-set="font"] button b{font-size:19px;white-space:nowrap}
.preview{position:sticky;top:-6px;z-index:5;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:4px}
.pv-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pv-title{font-family:var(--mincho);font-weight:700;font-size:26px;line-height:1.2}
.pv-sub{font-family:var(--jp);font-size:12px;color:var(--muted)}
.pv-k{font-family:var(--mincho);font-size:44px;line-height:1;color:var(--accent);flex:none}
.pv-line{font-family:var(--jp);font-size:18px;font-weight:500;line-height:1.95;margin-top:4px}

.page,.home{overflow-x:hidden}
.fontgrid button{min-width:0}

.preview{max-width:100%;box-sizing:border-box}
.fontgrid button[aria-pressed="true"]{background:var(--card);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
.home-head .sub{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-family:var(--jp);letter-spacing:.04em}
.home-head .icon-btn{width:40px;height:40px}
.home-head .icon-btn svg{width:21px;height:21px}
.home-head h1{margin:0;font-family:var(--mincho);font-size:30px;line-height:1.2;font-weight:700;letter-spacing:.02em}
.home-head .note{margin:0}
.streak{display:flex;flex-direction:column;gap:12px}
.streak-top{display:flex;align-items:center;gap:14px}
.flame{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--soft);font-size:28px;line-height:1}

.streak-n{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.streak-n small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.week .d i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ghost);font-style:normal;font-size:13px;color:transparent}
.week .d.on i{background:var(--grad);color:#fff}
.week .d.today{color:var(--ink)}
.week .d.today:not(.on) i{background:var(--card);box-shadow:inset 0 0 0 2px var(--accent)}
.hero{display:block;width:100%;box-sizing:border-box;text-align:left;padding:16px;border-radius:24px}
.hero .board-title{font-size:clamp(21px,6vw,26px);margin-top:4px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:1}
.hero-meta span{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:999px}
.hero-go{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;position:relative;z-index:1}
.hero-go b{background:#fff;color:#2b2bd9;border-radius:999px;padding:9px 18px;font-size:15px}
.hero-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.hero-bar i{display:block;height:100%;background:#fff;border-radius:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border-radius:20px;padding:14px;min-height:96px;position:relative}
.tile .tk{font-family:var(--mincho);font-size:24px;line-height:1.1;margin-bottom:auto;color:var(--accent)}
.tile b{font-size:16px;margin-top:8px}
.tile span{font-size:13px;color:var(--muted);font-weight:500}
.tile .badge{position:absolute;top:12px;right:12px;min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:var(--stamp);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.link{font-size:14px;font-weight:700;color:var(--accent);padding:4px 0}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--rule)}
.lrow:last-child{border-bottom:0;padding-bottom:0}
.lrow:first-child{padding-top:0}
.lrow .st{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ghost);font-size:13px;font-weight:700;color:var(--muted)}
.lrow .st.done{background:var(--good);color:#fff}
.lrow .st.half{background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.lrow .tx{flex:1;min-width:0}
.lrow .tx div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tx small{display:block;color:var(--muted);font-size:12.5px}
.page-head{display:flex;align-items:center;gap:10px;padding-top:2px}
.page-head h2{margin:0;font-size:22px;font-weight:700;flex:1;min-width:0}
.page-head .jp{font-family:var(--mincho);color:var(--muted);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--card);color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.srow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.srow:last-child{border-bottom:0;padding-bottom:0}
.srow:first-child{padding-top:0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.kcell{background:var(--card);border-radius:16px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.kcell .k{font-family:var(--mincho);font-size:36px;line-height:1.2}
.kcell .m{font-size:13px;font-weight:600;line-height:1.25}
.kcell .r{font-family:var(--jp);font-size:11px;color:var(--muted);line-height:1.3}
</style>

</head>
<body>
<div class="app" id="app">
  <main class="home" id="home"><div class="empty step"><h2>にほんご線</h2><p class="note">Loading…</p></div></main>
  <main class="page" id="page" hidden></main>

  <div class="top" id="top" hidden>
    <div class="top-l">
      <a class="icon-btn" href="#" id="homeBtn" aria-label="Home"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M2 7.2 8 2l6 5.2M3.8 6v7.5h8.4V6"/></svg></a>
      <button class="date-btn" id="dateBtn" aria-label="Choose a lesson">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
        <span id="dateLabel">Loading…</span>
      </button>
    </div>
    <button class="toggle" id="furiBtn" aria-pressed="true"><span>ふりがな</span><span class="pill"></span></button>
  </div>

  <div class="board" id="board" hidden>
    <div class="board-main">
      <div class="board-kicker" id="kicker">Today's stop</div>
      <div class="board-title" id="bTitle">にほんご線</div>
      <div class="board-en" id="bEn">Your daily Japanese</div>
    </div>
    <div class="band"><div class="prev" id="bPrev"></div><div class="num" id="bNum">--</div><div class="next" id="bNext"></div></div>
  </div>
  <div class="stops" id="stops" hidden><div class="fill" id="fill"></div></div>

  <main class="stage" id="stage" hidden>
    <div class="empty step">
      <h2>Your lessons are on their way</h2>
      <p class="note">Each morning a new lesson appears here. Loading the latest one…</p>
    </div>
  </main>

  <nav class="nav" id="nav" hidden>
    <button class="btn ghost" id="back">Back</button>
    <button class="btn primary" id="next">Next</button>
  </nav>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="sheet" role="dialog" aria-label="All lessons">
    <h2>All lessons</h2>
    <div id="list"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  /* Markup: {漢字|かんじ} = furigana; {漢字|かんじ|meaning} or {かな||meaning} = a hard word you can tap for its meaning. */
  const MARK = /\{([^|{}]+)\|([^|{}]*)(?:\|([^{}]+))?\}/g;
  const glossSrc = [];   // the source sentence of each rendered string, so a tapped word can be saved with its sentence
  const ruby = s => {
    const raw = String(s ?? ""), si = raw.includes("|") ? glossSrc.push(raw) - 1 : -1;
    return esc(raw).replace(MARK, (m, b, r, g) => {
      if (!g) return r ? `<ruby>${b}<rt>${r}</rt></ruby>` : m;
      const a = `class="gl" tabindex="0" role="button" data-gl="${g}" data-r="${r}" data-si="${si}"`;
      return r ? `<ruby ${a}>${b}<rt>${r}</rt></ruby>` : `<span ${a}>${b}</span>`;
    });
  };
  const plain = s => String(s ?? "").replace(MARK, "$1");
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  };
  const ICON_SAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

  let lessons = [], lesson = null, steps = [], idx = 0, db = null, sample = null, castById = {};
  const FMT = {dialogue:{jp:"会話", en:"Dialogue", chip:"Dialogue"}, line:{jp:"LINE", en:"LINE chat", chip:"LINE chat"},
    story:{jp:"お話", en:"Story", chip:"Story"}, text:{jp:"読み物", en:"Real text", chip:"Real text"}};
  const fmtOf = L => FMT[L.format] ? L.format : "dialogue";

  /* ---------- furigana ---------- */
  let furi = store.get("furi", true);
  const applyFuri = () => {
    document.body.classList.toggle("furi-off", !furi);
    $("furiBtn").setAttribute("aria-pressed", String(furi));
  };
  $("furiBtn").onclick = () => { furi = !furi; store.set("furi", furi); applyFuri(); };
  document.addEventListener("click", e => {
    const r = e.target.closest("ruby");
    if (r && !furi) r.classList.toggle("peek");
  });
  applyFuri();

  /* ---------- kanji dictionary (data/kanji.json: meanings + readings, from KANJIDIC) ---------- */
  let KD = null, kdLoad = null;
  const kanjiDict = () => kdLoad || (kdLoad = fetch("data/kanji.json").then(r => r.ok ? r.json() : {k:{}}).then(j => (KD = j.k || {})).catch(() => (KD = {})));
  const kanjiOf = s => [...new Set([...plain(s)].filter(ch => /[一-鿿㐀-䶿]/.test(ch)))];
  // one row per kanji: big character, meaning, readings
  const kanjiParts = (s, D) => kanjiOf(s).map(ch => {
    const e = D[ch]; if (!e) return "";
    return `<div class="kpart"><div class="kc">${esc(ch)}</div><div style="min-width:0"><div class="km">${esc(e[0])}</div>
      <div class="kr">${esc([e[1], e[2]].filter(Boolean).join(" · "))}</div></div></div>`;
  }).join("");

  /* ---------- hard-word glosses: tap an underlined word for its meaning ---------- */
  const gpop = document.createElement("div");
  gpop.className = "gpop"; gpop.id = "gpop"; gpop.hidden = true; gpop.setAttribute("role", "dialog");
  document.body.appendChild(gpop);
  let gFor = null;
  const hideGloss = () => { if (gFor) gFor.classList.remove("gl-on"); gpop.hidden = true; gFor = null; };
  const showGloss = el => {
    if (gFor === el){ hideGloss(); return; }
    hideGloss();
    const base = el.tagName === "RUBY" ? Array.from(el.childNodes).filter(n => n.nodeName !== "RT").map(n => n.textContent).join("") : el.textContent;
    const r = el.dataset.r || "", g = el.dataset.gl || "", src = glossSrc[+el.dataset.si] || "";
    const v = lesson && (lesson.vocab || []).find(x => plain(x.jp) === base || x.surface === base);
    const word = r ? `{${base}|${r}}` : base;
    const line = lesson && [...(lesson.phrases || []), ...(lesson.dialogue || [])].find(x => x.jp === src);
    const key = "w:" + (v ? plain(v.jp) : base);
    const def = v ? wordDef(lesson, v)
      : {kind:"word", word, reading:r || base, en:g, note:"", surface:base, sent:src, sentEn:line ? line.en : "", lesson:lesson ? lesson.id : ""};
    gpop.innerHTML = `<div class="gpop-top"><div style="min-width:0">
        <div class="gpop-w">${esc(base)}</div>${r ? `<div class="gpop-r">${esc(r)}</div>` : ""}
      </div>${starBtn(key, def)}</div>
      <div class="gpop-m">${esc(g)}</div>${v && v.note ? `<div class="note">${ruby(v.note)}</div>` : ""}<div class="gpop-k" hidden></div>`;
    gpop.hidden = false; gFor = el; el.classList.add("gl-on");
    // each kanji in the word, with its own meaning (helps it stick)
    const ks = kanjiOf(base);
    if (ks.length) kanjiDict().then(D => {
      if (gFor !== el) return;
      const rows = ks.filter(ch => D[ch]).map(ch => `<div><b>${esc(ch)}</b>${esc(D[ch][0])}</div>`).join("");
      const box = gpop.querySelector(".gpop-k");
      if (rows && box){ box.innerHTML = rows; box.hidden = false; place(); }
    });
    function place(){
      const b = el.getBoundingClientRect(), W = innerWidth, H = innerHeight, pw = Math.min(300, W - 32);
      gpop.style.width = pw + "px";
      gpop.style.left = Math.max(16, Math.min(W - pw - 16, b.left + b.width / 2 - pw / 2)) + "px";
      const ph = gpop.offsetHeight, below = b.bottom + 8;
      gpop.style.top = (below + ph < H - 12 || b.top - ph - 8 < 12 ? below : b.top - ph - 8) + "px";
    }
    place();
  };
  document.addEventListener("click", e => {
    if (e.target.closest("#gpop")) return;
    const el = e.target.closest(".gl");
    if (el){ e.stopPropagation(); e.preventDefault(); showGloss(el); return; }
    if (gFor) hideGloss();
  }, true);
  document.addEventListener("keydown", e => {
    const el = e.target.closest && e.target.closest(".gl");
    if (el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); showGloss(el); }
    if (e.key === "Escape") hideGloss();
  });
  addEventListener("scroll", hideGloss, true);
  addEventListener("resize", hideGloss);

  /* ---------- speech ---------- */
  // Recorded Google voices (audio/<lesson>.json maps a line's plain text to its mp3),
  // with the device's own Japanese voice as a fallback for anything without a file.
  const hasTTS = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
  const canSpeak = true;
  let jaVoice = null;
  const pickVoice = () => { try{ jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; }catch{} };
  if (hasTTS){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch{} }
  const audioMaps = {};
  const loadAudio = async id => {
    if (audioMaps[id]) return audioMaps[id];
    try{
      const r = await fetch("audio/" + id + ".json", {cache: "no-cache"});
      audioMaps[id] = r.ok ? await r.json() : {};
    }catch{ audioMaps[id] = {}; }
    return audioMaps[id];
  };

    a.onerror = () => device();

  function renderBoard(){

    const p = steps[idx-1], n = steps[idx+1];
    $("bPrev").innerHTML = p ? `<span>‹ ${esc(p.jp)}</span>` : "";
    $("bNext").innerHTML = n ? `<span>${esc(n.jp)} ›</span>` : "";
    const stops = $("stops");
    stops.querySelectorAll(".stop").forEach(x => x.remove());
    steps.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "stop" + (i < idx ? " done" : i === idx ? " here" : "");
      d.innerHTML = "<i></i>";
      stops.appendChild(d);
    });
    // Each stop sits in the middle of an equal slot: the track runs from the first
    // dot's centre to the last one's, and the fill ends exactly on the current dot.
    const ns = Math.max(steps.length, 1), pct = ns > 1 ? idx / (ns - 1) : 0;
    stops.style.setProperty("--edge", (50 / ns) + "%");
    $("fill").style.width = ((100 - 100 / ns) * pct) + "%";
  }

  function wireStep(st){
    const L = lesson;
    if (st.type === "phrase"){
      $("rev").onclick = e => {
        const b = e.currentTarget; b.classList.add("open"); b.textContent = st.p.en;
        const n = $("pnote"); if (n) n.hidden = false;
      };
    }
    if (st.type === "dialogue"){
      document.querySelectorAll("[data-show]").forEach(b => b.onclick = e => {
        if (e.target.closest("[data-say]") || e.target.closest("ruby")) return;
        const en = document.querySelector(`[data-en="${b.dataset.show}"]`);
        en.classList.toggle("hid");
      });
      const pa = $("playAll");
      if (pa) pa.onclick = () => speakAll(L.dialogue.map(d => d.jp));
    }
    if (st.type === "kanji"){
      $("krev").onclick = e => {
        const k = L.kanji, b = e.currentTarget;
        $("kr").textContent = k.reading;
        b.classList.add("open"); b.textContent = k.meaning;
        $("kwhere").hidden = false;
        speak(k.reading);
        kanjiDict().then(D => {
          const box = $("kparts"); if (!box) return;
          const rows = kanjiParts(k.kanji, D);
          if (rows || k.breakdown){ box.querySelector(".kparts").innerHTML = rows; box.hidden = false; }
        });
      };
    }
    if (st.type === "warm") wireWarm();
    if (st.type === "words") $("vgo").onclick = () => runVocabQuiz();
    if (st.type === "grammar" && $("ggo")) $("ggo").onclick = runGrammarQuiz;
    if (st.type === "kstudy"){
      rememberKanji(L.kanji_study);
      document.querySelectorAll("[data-draw]").forEach(b => b.onclick = () => {
        const pad = b.nextElementSibling;
        if (!pad.hidden){ pad.hidden = true; b.textContent = "✍️ Draw it · stroke order"; return; }
        pad.hidden = false; b.textContent = "Hide drawing pad";
        if (!pad.dataset.ready){ makePad(pad, b.dataset.draw); pad.dataset.ready = "1"; }
      });
    }
    if (st.type === "kquiz") runKanjiQuiz();
    if (st.type === "challenge") wireChallenge();
    if (st.type === "done") $("restart").onclick = () => { idx = 0; renderStep(); };
  }

  /* ---------- warm-up ---------- */
  function wireWarm(){ runCards($("warm"), warmState, "Warm-up"); }
  /* W = {queue, qi, ok, again:Set, practice?}; practice runs don't change the schedule */
  function runCards(box, W, title, onFinish){
    const queue = W.queue, again = W.again;
    const kseen = seenKanji();
    const front = c => {
      if (c.kind === "kanji") return `<div class="qprompt k">${esc(c.kanji)}</div>
        ${c.words?.[0] ? `<div class="wsent" style="text-align:center">${esc(plain(c.words[0].jp))}</div>` : ""}
        <p class="note" style="margin:0;text-align:center">Meaning? And how do you read the word?</p>`;
      if (c.kind === "line") return `<div class="wsent">${esc(plain(c.sent))}</div><p class="note" style="margin:0">Read it out loud. What does it mean?</p>`;
      if (c.kind === "grammar") return `<div class="qprompt">${esc(plain(c.pattern))}</div>${c.sent ? `<div class="wsent">${esc(plain(c.sent))}</div>` : ""}<p class="note" style="margin:0">What does this pattern mean? How is it made?</p>`;
      const ks = [...plain(c.word)].filter(ch => kseen[ch]);
      return `<div class="wsent">${c.sent ? highlight(c.sent, c.surface) : `<mark>${esc(plain(c.word))}</mark>`}</div>
        <p class="note" style="margin:0">What does the highlighted word mean?${ks.length ? ` And how do you read ${esc(ks.join("・"))} in it?` : ""}</p>`;
    };
    const back = c => {
      if (c.kind === "kanji") return `<div style="font-size:18px;font-weight:700">${esc(c.meaning)}</div>
        <div class="kread">${c.on ? `<b>On</b><span style="font-family:var(--jp)">${esc(c.on)}</span>` : ""}${c.kun ? `<b>Kun</b><span style="font-family:var(--jp)">${esc(c.kun)}</span>` : ""}</div>
        ${(c.words || []).map(w => `<div class="row" style="justify-content:flex-start;gap:10px"><span class="jp-mid" style="line-height:1.8">${ruby(w.jp)}</span><span class="note">${esc(w.en)}</span></div>`).join("")}`;
      if (c.kind === "line") return `<div class="jp-mid">${ruby(c.sent)}</div><div>${esc(c.sentEn)}</div>${sayBtn(c.sent)}`;
      if (c.kind === "grammar") return `<div style="font-size:18px;font-weight:700">${esc(c.meaning)}</div>${c.form ? `<div class="gline">${ruby(c.form)}</div>` : ""}${c.sent ? `<div class="jp-mid" style="font-size:16px">${ruby(c.sent)}</div><div class="note">${esc(c.sentEn)}</div>${sayBtn(c.sent)}` : ""}`;
      const ks = [...plain(c.word)].filter(ch => kseen[ch]);
      return `<div class="row" style="justify-content:flex-start;gap:10px"><span class="jp-big" style="line-height:1.7">${ruby(c.word)}</span><span style="font-size:17px;font-weight:600">${esc(c.en)}</span></div>
        ${c.note ? `<div class="note">${ruby(c.note)}</div>` : ""}
        ${ks.map(ch => `<div class="note">${esc(ch)} = ${esc(kseen[ch].meaning)} · ${esc([kseen[ch].on, kseen[ch].kun].filter(Boolean).join(" / "))}</div>`).join("")}
        ${c.sent ? `<div class="jp-mid" style="font-size:16px">${ruby(c.sent)}</div><div class="note">${esc(c.sentEn)}</div>` : ""}
        ${sayBtn(c.sent || c.word)}`;
    };
    const show = () => {
      if (W.qi >= queue.length){
        const n = queue.length - again.size;
        box.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
          <span class="hanko">復</span><h3 style="margin:0;font-size:20px">${esc(title)} done</h3>
          <p style="margin:0">${W.ok} of ${n} remembered first time. ${W.practice ? "Practice doesn't change your schedule." : again.size ? "Cards you missed come back tomorrow." : "Nice."}</p></div>`;
        if (W.practice && !W.logged){ W.logged = true; logDay("r", n); }
        if (onFinish) onFinish(box);
        return;
      }
      const c = queue[W.qi];
      box.innerHTML = `<div class="row"><span class="label">${esc(title)}</span><span class="count">${W.qi+1}/${queue.length}</span></div>
        <div class="card" style="display:flex;flex-direction:column;gap:10px">${front(c)}</div>
        <button class="reveal" id="wrev">Tap to check</button>
        <div id="wback" class="card" hidden style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="grade" id="wgrade" hidden><button class="btn ghost" id="wagain">Again</button><button class="btn good" id="wgot">Got it</button></div>`;
      const sc = box.closest(".stage,.page"); if (sc) sc.scrollTop = 0;
      $("wrev").onclick = () => {
        $("wrev").hidden = true; $("wback").innerHTML = back(c); $("wback").hidden = false; $("wgrade").hidden = false;
      };
      $("wagain").onclick = () => {
        if (!again.has(c.k)){ if (!W.practice) grade(c, false); again.add(c.k); queue.push(c); }
        W.qi++; show();
      };
      $("wgot").onclick = () => {
        if (!again.has(c.k)){ if (!W.practice) grade(c, true); W.ok++; }
        W.qi++; show();
      };
    };
    show();
  }

  /* ---------- today's vocab + kanji quizzes ---------- */
  function runVocabQuiz(){
    const L = lesson, vs = L.vocab;
    const picks = shuffle(vs).slice(0, Math.min(4, vs.length));
    const qs = picks.map(v => {
      const key = "w:" + plain(v.jp);
      return {ask:"What does it mean?", prompt:esc(plain(v.jp)),
        options:[v.en, ...shuffle(vs.filter(x => x !== v).map(x => x.en)).slice(0, 3)],
        onWrong:() => { cardDefs[key] = wordDef(L, v); addCard(key); paintStars(key); },
        wrongNote:`${ruby(v.jp)} (${esc(v.reading)}). Added to your review.`};
    });
    runQuiz($("vquiz"), qs, (r, n) => {
      $("vquiz").innerHTML = `<div class="card"><b>${r}/${n} right.</b> <span class="note">Words you missed were saved for review.</span></div>`;
    });
  }
  /* stroke order: strokes/<hex>.json (KanjiVG, saved by scripts/strokes.py), or KanjiVG straight from the CDN */
  const strokeCache = {};
  const loadStrokes = ch => strokeCache[ch] || (strokeCache[ch] = (async () => {
    const hex = ch.codePointAt(0).toString(16).padStart(5, "0");
    try{ const r = await fetch("strokes/" + hex + ".json"); if (r.ok){ const j = await r.json(); if (j.d?.length) return j; } }catch{}
    try{
      const r = await fetch("https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/" + hex + ".svg");
      if (!r.ok) return null;
      const doc = new DOMParser().parseFromString(await r.text(), "image/svg+xml");
      const d = [...doc.querySelectorAll("path[id*='-s']")].sort((a, b) => +a.id.split("-s")[1] - +b.id.split("-s")[1]).map(p => p.getAttribute("d"));
      const n = [...doc.querySelectorAll("text")].map(t => { const m = /([\d.]+) ([\d.]+)\)$/.exec(t.getAttribute("transform") || ""); return m ? [+m[1], +m[2]] : null; });
      return d.length ? {d, n} : null;
    }catch{ return null; }
  })());
  const SVGNS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  /* optional practice pad: watch the stroke order, trace over the guide, then hide it and draw from memory */
  function makePad(el, kanji){
    el.innerHTML = `<div class="pad-order" hidden><button class="btn primary" data-play>▶ Stroke order</button><button class="btn ghost" data-step>Next stroke</button></div>
      <div class="pad-box">
        <svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0V100M0 50H100" stroke="currentColor" stroke-width=".6" stroke-dasharray="3 3" fill="none"/></svg>
        <div class="guide">${esc(kanji)}</div><svg class="order off" viewBox="0 0 109 109"></svg><canvas></canvas></div>
      <div class="pad-tools"><button class="btn ghost" data-g>Guide off</button><button class="btn ghost" data-u>Undo</button><button class="btn ghost" data-c>Clear</button></div>
      <p class="note" style="margin:0;text-align:center" data-help>Trace it first, then hide the guide and write it from memory.</p>`;
    const box = el.querySelector(".pad-box"), cv = el.querySelector("canvas"), ctx = cv.getContext("2d"), guide = el.querySelector(".guide");
    const osvg = el.querySelector("svg.order");
    let SD = null, shown = 0, run = 0;
    const startOf = d => { const m = /^[Mm]\s*([-\d.]+)[,\s]*([-\d.]+)/.exec(d); return m ? [+m[1], +m[2]] : null; };
    const drawStroke = (i, animate) => new Promise(done => {
      const d = SD.d[i], live = svgEl("path", {d, class:"live"});
      osvg.appendChild(live);
      const s = startOf(d), np = SD.n[i] || s;
      if (np) { const t = svgEl("text", {x:np[0], y:np[1], class:"num"}); t.textContent = i + 1; osvg.appendChild(t); }
      if (s) osvg.appendChild(svgEl("circle", {cx:s[0], cy:s[1], r:2.2, class:"dot"}));
      if (!animate || !live.animate) return done();
      const len = live.getTotalLength();
      live.style.strokeDasharray = len; live.style.strokeDashoffset = len;
      const a = live.animate([{strokeDashoffset:len}, {strokeDashoffset:0}], {duration:Math.max(300, Math.min(900, len * 14)), easing:"ease-in-out", fill:"forwards"});
      a.onfinish = () => { live.style.strokeDasharray = ""; live.style.strokeDashoffset = ""; done(); };
    });
    const resetOrder = () => {
      osvg.innerHTML = ""; shown = 0;
      SD.d.forEach(d => osvg.appendChild(svgEl("path", {d, class:"ghost"})));
      osvg.classList.remove("off"); guide.classList.add("off");
    };
    const play = async () => {
      const me = ++run; resetOrder();
      for (let i = 0; i < SD.d.length; i++){
        if (me !== run) return;
        await drawStroke(i, true); shown = i + 1;
        await new Promise(r => setTimeout(r, 180));
      }
    };
    const step = async () => {
      run++;
      if (osvg.classList.contains("off") || shown >= SD.d.length) resetOrder();
      const i = shown; shown++;
      await drawStroke(i, true);
      el.querySelector("[data-step]").textContent = shown >= SD.d.length ? "Start again" : `Next stroke (${shown + 1}/${SD.d.length})`;
    };

    }
    const latest = lessons[lessons.length - 1], isToday = latest.id === t;
    const s = streak(), due = allDue().length, deckN = Object.keys(getDeck()).length, kN = Object.keys(seenKanji()).length;
    const days = [...Array(7)].map((_, i) => addDays(t, i - 6));
    const dn = d => WD[new Date(d + "T12:00:00").getDay()];
    const st = lessonStatus(latest.id);
    const earlier = lessons.slice(0, -1).reverse().slice(0, 4);
    const T = APP_TITLE;
    el.innerHTML = `<div class="step" style="gap:12px">
      <div class="home-head"><div style="min-width:0"><h1>${T[0]}</h1><p class="sub">${esc(T[1])}</p></div>
        <a class="icon-btn" href="#settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a></div>
      <div class="card streak">
        <div class="streak-top">
          <span class="flame ${s.today ? "" : "cold"}">🔥</span>
          <div style="flex:1;min-width:0">
            <div class="streak-n">${s.cur} <small>day${s.cur === 1 ? "" : "s"} in a row</small></div>
            <div class="note">${s.today ? "Today counts. お疲れ様！" : s.cur ? "Finish a lesson or a review today to keep it going." : "Finish a lesson or a review to start a streak."}</div>
          </div>
          ${s.best > 1 ? `<div style="text-align:right;flex:none"><div class="label">Best</div><div style="font-weight:700;font-size:18px">${s.best}</div></div>` : ""}
        </div>
        <div class="week">${days.map(d => `<div class="d ${s.a[d] ? "on" : ""} ${d === t ? "today" : ""}"><i>✓</i>${esc(dn(d))}</div>`).join("")}</div>
      </div>

      <a class="board hero" href="#${esc(latest.id)}" id="hero">
        <div class="board-kicker">${isToday ? (latest.category === "news" ? "ニュース · Today's news lesson" : "今日 · Today's lesson") : "最新 · " + esc(fmtDate(latest.id))}</div>
        <div class="board-title" id="heroTitle">${esc(latest.topic)}</div>
        <div class="board-en" id="heroEn" style="white-space:normal">${esc(latest.topic)}</div>
        <div class="hero-meta">${latest.category ? `<span>${esc(fieldOf(latest.category))}</span>` : ""}${latest.format && FMT[latest.format] ? `<span>${esc(FMT[latest.format].chip)}</span>` : ""}<span id="heroGram" hidden></span></div>
        <div class="hero-go"><div class="hero-bar" id="heroBar"><i style="width:${st.cls === "done" ? 100 : 0}%"></i></div><b>${st.cls === "done" ? "Done ✓ · Open" : st.cls === "half" ? "Continue" : "Start"}</b></div>
      </a>

      <div class="tiles">
        <a class="tile" href="#review">${due ? `<span class="badge">${due}</span>` : ""}<span class="tk">復習</span><b>Review</b><span>${due ? `${due} card${due === 1 ? "" : "s"} due` : deckN ? "All caught up" : "Star words to start"}</span></a>
        <a class="tile" href="#saved"><span class="tk">★</span><b>Saved</b><span>${deckN} card${deckN === 1 ? "" : "s"}</span></a>
        <a class="tile" href="#kanji"><span class="tk">漢字</span><b>Kanji</b><span>${kN} learned</span></a>
        <a class="tile" href="#lessons"><span class="tk">線</span><b>All lessons</b><span>${lessons.length} so far · ${Object.keys(doneMap()).length} done</span></a>
      </div>

      ${earlier.length ? `<div class="sec-h"><span class="label">Earlier lessons</span>${lessons.length > 5 ? `<a class="link" href="#lessons">See all</a>` : ""}</div>
      <div class="card">${earlier.map(lessonRow).join("")}</div>` : ""}

    </div>`;
    $("home").scrollTop = 0;
    fillTitles(el);
    // fill the hero with the lesson's Japanese title and progress
    loadLesson(latest.id).then(L => {
      if ($("home").hidden || !$("heroTitle")) return;
      $("heroTitle").innerHTML = ruby(L.title_jp || L.topic);
      if (L.grammar && L.grammar.pattern){ $("heroGram").hidden = false; $("heroGram").textContent = "文法 " + plain(L.grammar.pattern); }
      if (st.cls === "half"){
        const n = buildSteps(L).length;
        $("heroBar").firstElementChild.style.width = Math.min(95, Math.round(100 * store.get("pos:" + L.id, 0) / Math.max(n - 1, 1))) + "%";
      }
    }).catch(() => {});
  }
  function page(title, jp, body){
    setMode("page");
    $("page").innerHTML = `<div class="step" style="gap:12px">
      <div class="page-head"><a class="icon-btn" href="#" aria-label="Home"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></a><h2>${esc(title)}</h2><span class="jp">${esc(jp)}</span></div>
      ${body}</div>`;
    $("page").scrollTop = 0;
  }
  function renderReview(){
    const due = allDue(), deck = Object.values(getDeck());
    page("Review", "復習", `<div id="rv" style="display:flex;flex-direction:column;gap:10px"></div>`);
    const box = $("rv");
    const after = b => b.insertAdjacentHTML("beforeend", `<a class="btn primary" href="#" style="width:100%;box-sizing:border-box;margin-top:4px">Back to home</a>`);
    const practice = () => runCards(box, {queue:shuffle(deck).slice(0, 10), qi:0, ok:0, again:new Set(), practice:true}, "Practice", after);
    if (due.length){
      runCards(box, {queue:due.slice(0, 20), qi:0, ok:0, again:new Set()}, "Review", after);
      return;
    }
    const next = deck.map(c => c.due).filter(d => d > todayStr()).sort()[0];
    box.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
      <span class="hanko">${deck.length ? "済" : "☆"}</span>
      <h3 style="margin:0;font-size:20px">${deck.length ? "All caught up" : "Nothing saved yet"}</h3>
      <p style="margin:0">${deck.length ? `Nothing is due today.${next ? ` Next card comes back ${esc(fmtDate(next))}.` : ""}` : "Tap ☆ on phrases, lines, words and kanji in a lesson. They come back here the next day."}</p></div>
      ${deck.length ? `<button class="btn ghost" id="prac" style="width:100%">Practice ${Math.min(10, deck.length)} random cards anyway</button>` : ""}`;
    if ($("prac")) $("prac").onclick = practice;
  }
  function renderSaved(){
    const KINDS = [["all", "All"], ["word", "Words"], ["line", "Lines"], ["kanji", "Kanji"], ["grammar", "Grammar"]];
    let kind = "all";
    page("Saved", "保存", `<div class="chips" id="sk">${KINDS.map(([k, n]) => `<button data-k="${k}" aria-pressed="${k === kind}">${n}</button>`).join("")}</div><div id="sl"></div>`);
    const row = c => {
      let main = "";
      if (c.kind === "kanji") main = `<div class="row" style="justify-content:flex-start;gap:12px"><span class="kbig" style="font-size:40px">${esc(c.kanji)}</span><div><div style="font-weight:600">${esc(c.meaning)}</div><div class="note" style="font-family:var(--jp)">${esc([c.on, c.kun].filter(Boolean).join(" · "))}</div></div></div>`;
      else if (c.kind === "line") main = `<div class="jp-mid" style="font-size:17px">${ruby(c.sent)}</div><div class="note">${esc(c.sentEn)}</div>`;
      else if (c.kind === "grammar") main = `<div class="jp-mid" style="font-weight:700">${ruby(c.pattern)}</div><div style="font-size:15px">${esc(c.meaning)}</div>`;
      else main = `<div class="row" style="justify-content:flex-start;gap:10px"><span class="jp-mid" style="line-height:1.8">${ruby(c.word)}</span><span style="font-size:15px">${esc(c.en)}</span></div>${c.sent ? `<div class="src" style="font-family:var(--jp);font-size:13px;color:var(--muted)">${highlight(c.sent, c.surface)}</div>` : ""}`;
      const when = c.due <= todayStr() && c.added < todayStr() ? "Due now" : "Next " + fmtDate(c.due);
      return `<div class="srow"><div style="min-width:0;flex:1">${main}<div class="note" style="font-size:12px;margin-top:2px">${esc(when)}${c.lesson ? ` · <a href="#${esc(c.lesson)}" style="color:inherit">from ${esc(fmtDate(c.lesson))}</a>` : ""}</div></div>${starBtn(c.k, c)}</div>`;
    };
    const draw = () => {
      const cards = Object.values(getDeck()).filter(c => kind === "all" || (c.kind || "word") === kind).sort((a, b) => a.added < b.added ? 1 : a.added > b.added ? -1 : 0);
      $("sl").innerHTML = cards.length ? `<div class="card">${cards.map(row).join("")}</div>` : `<p class="note">Nothing here yet. Tap ☆ in a lesson to save it.</p>`;
    };
    $("sk").onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; kind = b.dataset.k; $("sk").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); draw(); };
    draw();
  }
  function renderKanji(){
    const ks = Object.entries(seenKanji());
    page("Kanji", "漢字", ks.length
      ? `<p class="note" style="margin:0">${ks.length} kanji studied so far. ☆ them in a lesson to drill them in review.</p>
         <div class="kgrid">${ks.reverse().map(([k, v]) => `<div class="kcell"><div class="k">${esc(k)}</div><div class="m">${esc(v.meaning)}</div><div class="r">${esc([v.on, v.kun].filter(Boolean).join(" · "))}</div></div>`).join("")}</div>`
      : `<p class="note">Kanji show up here after you reach the "Today's kanji" stop in a lesson.</p>`);
  }
  function renderLessons(){
    const byMonth = {};
    lessons.slice().reverse().forEach(l => { const d = new Date(l.id + "T12:00:00"), m = `${d.getFullYear()}年${d.getMonth() + 1}月`; (byMonth[m] = byMonth[m] || []).push(l); });
    page("All lessons", "線", Object.entries(byMonth).map(([m, ls]) => `<div class="label" style="font-family:var(--jp)">${esc(m)}</div><div class="card">${ls.map(lessonRow).join("")}</div>`).join(""));
    fillTitles($("page"));
  }

  /* ---------- data: static files ---------- */
  const cache = {}, raw = {};
  const getJSON = id => raw[id] || (raw[id] = fetch("lessons/" + id + ".json", {cache: "no-cache"})
    .then(r => { if (!r.ok) throw new Error("missing"); return r.json(); })
    .then(L => { L.id = id; return L; })
    .catch(e => { delete raw[id]; throw e; }));
  async function loadLesson(id){
    if (cache[id]) return cache[id];
    const L = await getJSON(id); cache[id] = L;
    await loadAudio(id);
    return L;
  }
  applySettings();
  (async () => {
    try{
      try{
        const cr = await fetch("cast.json", {cache: "no-cache"});
        if (cr.ok) (await cr.json()).cast.forEach(c => { castById[c.id] = c; });
      }catch{}
      try{
        const tr = await fetch("topics.json", {cache: "no-cache"});
        if (tr.ok){ const T = await tr.json(); ["fields", "special", "legacy"].forEach(k => (T[k] || []).forEach(f => { fieldName[f.id] = f.name; })); }
      }catch{}
      const r = await fetch("lessons/index.json", {cache: "no-cache"});
      const list = await r.json();
      const today = todayStr();
      lessons = list.filter(l => l.id && l.topic && l.id <= today).sort((a, b) => a.id < b.id ? -1 : 1);
      route();
    }catch{
      showEmpty("Can't load lessons", "Check your connection and reopen the app.");
    }
  })();
  if ("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch{} }
})();
</script>

</body>
</html>
