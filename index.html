<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16875a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Nihongo Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&display=swap">
<style>
/* Layout: one-screen phone app. A station name board (駅名標) on top, the step as the "station", a line of stops as progress, thumb-zone nav at the bottom. */
:root{
  --paper:#f3f5f4; --card:#ffffff; --ink:#16223a; --muted:#5d6779; --rule:#dde2e7;
  --line:#16875a; --line-ink:#ffffff; --stamp:#d23f28; --soft:#e7f3ed;
  --polite:#2f5fb3; --casual:#c06a12;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif JP",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1420; --card:#172033; --ink:#e7ebf2; --muted:#9aa4b5; --rule:#2a3448;
  --line:#35b67c; --line-ink:#07130d; --stamp:#ff6a52; --soft:#16302a;
  --polite:#7fa6f0; --casual:#f0a24f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1420; --card:#172033; --ink:#e7ebf2; --muted:#9aa4b5; --rule:#2a3448;
  --line:#35b67c; --line-ink:#07130d; --stamp:#ff6a52; --soft:#16302a;
  --polite:#7fa6f0; --casual:#f0a24f; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--line);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 6px}
.date-btn{font-size:13px;color:var(--muted);letter-spacing:.04em;padding:6px 0;display:flex;align-items:center;gap:6px}
.date-btn svg{width:14px;height:14px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 0}
.pill{width:38px;height:22px;border-radius:11px;background:var(--rule);position:relative;transition:background .2s}
.pill::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-pressed="true"] .pill{background:var(--line)}
.toggle[aria-pressed="true"] .pill::after{transform:translateX(16px)}

/* station board */
.board{background:var(--card);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.board-main{text-align:center;padding:12px 12px 8px}
.board-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.board-title{font-size:24px;font-weight:700;line-height:1.35;text-wrap:balance;margin-top:2px}
.board-en{font-size:13px;color:var(--muted);margin-top:2px}
.band{background:var(--line);color:var(--line-ink);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:12px;font-weight:500;min-height:28px}
.band .prev{justify-self:start;padding-left:10px;display:flex;gap:4px;align-items:center;min-width:0}
.band .next{justify-self:end;padding-right:10px;display:flex;gap:4px;align-items:center;min-width:0}
.band span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .num{background:var(--card);color:var(--line);font-weight:700;border-radius:3px;padding:1px 7px;font-variant-numeric:tabular-nums;font-size:12px}

/* line of stops */
.stops{display:flex;align-items:center;padding:12px 4px 4px;position:relative}
.stops::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:3px;background:var(--rule);transform:translateY(1px)}
.stops .fill{position:absolute;left:10px;top:50%;height:3px;background:var(--line);transform:translateY(1px);transition:width .3s}
.stop{flex:1;display:flex;justify-content:center;position:relative;z-index:1;padding:6px 0}
.stop i{width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--rule);display:block;transition:all .2s}
.stop.done i{border-color:var(--line);background:var(--line)}
.stop.here i{border-color:var(--line);background:var(--card);width:16px;height:16px;border-width:4px}

/* stage */
.stage{flex:1;overflow-y:auto;padding-block:14px 16px;min-height:0;-webkit-overflow-scrolling:touch}
.step{display:flex;flex-direction:column;gap:14px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.pill::after,.stops .fill{transition:none}}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 16px}

ruby{ruby-position:over}
rt{font-size:.5em;color:var(--muted);font-weight:500;letter-spacing:0;transition:opacity .15s}
.furi-off rt{opacity:0}
.furi-off ruby.peek rt{opacity:1}
.furi-off ruby{cursor:pointer;border-bottom:1px dotted var(--rule)}

.jp-big{font-size:26px;font-weight:500;line-height:2.1;word-break:keep-all;overflow-wrap:anywhere}
.jp-mid{font-size:19px;line-height:2;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor}
.chip.polite{color:var(--polite)} .chip.casual{color:var(--casual)} .chip.neutral{color:var(--muted)}
.say{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--line);padding:6px 10px;border-radius:999px;border:1.5px solid var(--line)}
.say svg{width:15px;height:15px}
.reveal{width:100%;text-align:left;border:1.5px dashed var(--rule);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:15px}
.reveal.open{border-style:solid;border-color:var(--soft);background:var(--soft);color:var(--ink)}
.note{font-size:14px;color:var(--muted)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* intro */
.intro-num{font-family:var(--mincho);font-size:64px;line-height:1;color:var(--line)}
.agenda{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.agenda li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.agenda b{font-variant-numeric:tabular-nums;color:var(--line);min-width:20px}

/* dialogue */
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.who{font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--soft);color:var(--line);white-space:nowrap;margin-top:8px}
.line.me .who{background:var(--line);color:var(--line-ink)}
.bubble{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;min-width:0}
.bubble .en{font-size:13.5px;color:var(--muted);border-top:1px solid var(--rule);margin-top:4px;padding-top:4px}
.bubble .en.hid{color:transparent;background:var(--rule);border-radius:4px;border-top-color:transparent;user-select:none}
.bubble-tools{display:flex;gap:8px;margin-top:4px}
.mini{font-size:12px;color:var(--line);font-weight:500;padding:4px 0}

/* kanji sign */
.sign{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;text-align:center}
.sign-top{padding:22px 12px 14px}
.sign-k{font-family:var(--mincho);font-size:72px;line-height:1.1;letter-spacing:.06em}
.sign-r{font-size:18px;color:var(--muted);margin-top:6px;min-height:1.6em}
.sign-bar{background:var(--line);color:var(--line-ink);font-weight:700;padding:6px;font-size:14px;letter-spacing:.08em}

/* tip */
.tip h3{margin:0;font-size:19px;line-height:1.4}
.tip p{margin:0;font-size:16px}
.hanko{display:inline-grid;place-items:center;width:44px;height:44px;border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;font-family:var(--mincho);font-size:22px;transform:rotate(-6deg)}

/* challenge */
textarea{width:100%;min-height:96px;resize:vertical;font-family:var(--jp);font-size:18px;line-height:1.6;padding:12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;font-weight:700;font-size:16px}
.btn.primary{background:var(--line);color:var(--line-ink)}
.btn.ghost{border:1.5px solid var(--rule);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.fb{display:flex;flex-direction:column;gap:10px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700}
.fb .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* nav */
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:10px max(12px,env(safe-area-inset-bottom,0px))}
.nav .btn{width:100%}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-height:70%;overflow-y:auto;border-radius:14px 14px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.sheet h2{font-size:16px;margin:0 0 10px}
.lesson-item{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--rule)}
.lesson-item small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lesson-item.cur{color:var(--line);font-weight:700}

.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding-top:20px}
.empty h2{margin:0;font-size:20px}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="date-btn" id="dateBtn" aria-label="Choose a lesson">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
      <span id="dateLabel">Loading…</span>
    </button>
    <button class="toggle" id="furiBtn" aria-pressed="true"><span>ふりがな</span><span class="pill"></span></button>
  </div>

  <div class="board" id="board">
    <div class="board-main">
      <div class="board-kicker" id="kicker">Today's stop</div>
      <div class="board-title" id="bTitle">にほんご線</div>
      <div class="board-en" id="bEn">Your daily Japanese</div>
    </div>
    <div class="band"><div class="prev" id="bPrev"></div><div class="num" id="bNum">--</div><div class="next" id="bNext"></div></div>
  </div>
  <div class="stops" id="stops"><div class="fill" id="fill"></div></div>

  <main class="stage" id="stage">
    <div class="empty step">
      <h2>Your lessons are on their way</h2>
      <p class="note">Each morning a new lesson appears here. Loading the latest one…</p>
    </div>
  </main>

  <nav class="nav" id="nav" hidden>
    <button class="btn ghost" id="back">Back</button>
    <button class="btn primary" id="next">Next</button>
  </nav>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="sheet" role="dialog" aria-label="All lessons">
    <h2>All lessons</h2>
    <div id="list"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ruby = s => esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
  const plain = s => String(s ?? "").replace(/\{([^|{}]+)\|[^{}]+\}/g, "$1");
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  };
  const ICON_SAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

  let lessons = [], lesson = null, steps = [], idx = 0, db = null, sample = null;

  /* ---------- furigana ---------- */
  let furi = store.get("furi", true);
  const applyFuri = () => {
    document.body.classList.toggle("furi-off", !furi);
    $("furiBtn").setAttribute("aria-pressed", String(furi));
  };
  $("furiBtn").onclick = () => { furi = !furi; store.set("furi", furi); applyFuri(); };
  document.addEventListener("click", e => {
    const r = e.target.closest("ruby");
    if (r && !furi) r.classList.toggle("peek");
  });
  applyFuri();

  /* ---------- speech ---------- */
  const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
  let jaVoice = null;
  const pickVoice = () => { try{ jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; }catch{} };
  if (canSpeak){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch{} }
  const speak = (text, slow) => {
    if (!canSpeak) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(plain(text));
      u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice; u.rate = slow ? 0.7 : 0.95;
      speechSynthesis.speak(u);
    }catch{}
  };
  const sayBtn = (text, label = "Listen") => canSpeak
    ? `<button class="say" data-say="${esc(text)}">${ICON_SAY}${label}</button>` : "";
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-say]");
    if (b){ speak(b.dataset.say, b.dataset.slow === "1"); }
  });

  /* ---------- steps ---------- */
  function buildSteps(L){
    const s = [{type:"intro", jp:"出発", en:"Departure"}];
    (L.phrases || []).forEach((p, i) => s.push({type:"phrase", p, i, jp:"フレーズ " + (i+1), en:"Phrase " + (i+1)}));
    if (L.dialogue?.length) s.push({type:"dialogue", jp:"会話", en:"Dialogue"});
    if (L.kanji) s.push({type:"kanji", jp:"看板の漢字", en:"Sign kanji"});
    if (L.tip) s.push({type:"tip", jp:"ヒント", en:"Tip"});
    if (L.challenge) s.push({type:"challenge", jp:"チャレンジ", en:"Your turn"});
    s.push({type:"done", jp:"終点", en:"Last stop"});
    return s;
  }

  function renderBoard(){
    const st = steps[idx];
    $("kicker").textContent = st.type === "intro" ? (lesson.news ? "ニュース · News day" : "Today's line") : st.en;
    $("bTitle").innerHTML = st.type === "intro" || st.type === "done" ? ruby(lesson.title_jp || lesson.topic) : esc(st.jp);
    $("bEn").textContent = st.type === "intro" || st.type === "done" ? lesson.topic : lesson.topic;
    $("bNum").textContent = String(idx + 1).padStart(2, "0");
    const p = steps[idx-1], n = steps[idx+1];
    $("bPrev").innerHTML = p ? `<span>‹ ${esc(p.jp)}</span>` : "";
    $("bNext").innerHTML = n ? `<span>${esc(n.jp)} ›</span>` : "";
    const stops = $("stops");
    stops.querySelectorAll(".stop").forEach(x => x.remove());
    steps.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "stop" + (i < idx ? " done" : i === idx ? " here" : "");
      d.innerHTML = "<i></i>";
      stops.appendChild(d);
    });
    const pct = steps.length > 1 ? idx / (steps.length - 1) : 0;
    $("fill").style.width = `calc((100% - 20px) * ${pct})`;
  }

  function renderStep(){
    const st = steps[idx], L = lesson, el = $("stage");
    let h = "";
    if (st.type === "intro"){
      h = `<div class="step">
        <div class="card" style="display:flex;flex-direction:column;gap:12px">
          <div class="label">Situation</div>
          <p style="margin:0;font-size:17px">${esc(L.context)}</p>
        </div>
        <div class="card"><ul class="agenda">
          <li><b>${(L.phrases||[]).length}</b>Key phrases, tap to check meaning</li>
          <li><b>1</b>Short dialogue to listen to</li>
          <li><b>1</b>Kanji you'll see on real signs</li>
          <li><b>1</b>Tip textbooks skip</li>
          <li><b>1</b>Challenge to answer in Japanese</li>
        </ul></div>
        <p class="note">Furigana switch is at the top. When it's off, tap any word to peek at its reading.</p>
      </div>`;
    }
    if (st.type === "phrase"){
      const p = st.p, reg = (p.register || "neutral").toLowerCase();
      h = `<div class="step">
        <div class="row"><span class="count">${st.i+1} / ${L.phrases.length}</span><span class="chip ${esc(reg)}">${esc(reg)}</span></div>
        <div class="card" style="display:flex;flex-direction:column;gap:14px">
          <div class="jp-big">${ruby(p.jp)}</div>
          ${p.romaji ? `<div class="note">${esc(p.romaji)}</div>` : ""}
          <div class="row" style="justify-content:flex-start">${sayBtn(p.jp)}${canSpeak ? `<button class="say" data-say="${esc(p.jp)}" data-slow="1">${ICON_SAY}Slow</button>` : ""}</div>
        </div>
        <button class="reveal" id="rev">Think of the meaning, then tap to check</button>
        ${p.note ? `<p class="note" id="pnote" hidden>${ruby(p.note)}</p>` : ""}
      </div>`;
    }
    if (st.type === "dialogue"){
      h = `<div class="step">
        ${L.dialogue_setting ? `<p class="note" style="margin:0">${ruby(L.dialogue_setting)}</p>` : ""}
        <div class="lines">${L.dialogue.map((d, i) => `
          <div class="line ${d.me ? "me" : ""}">
            <span class="who">${esc(d.speaker)}</span>
            <div class="bubble">
              <div class="jp-mid">${ruby(d.jp)}</div>
              <div class="en hid" data-en="${i}">${esc(d.en)}</div>
              <div class="bubble-tools">${canSpeak ? `<button class="mini" data-say="${esc(d.jp)}">Play</button>` : ""}<button class="mini" data-show="${i}">English</button></div>
            </div>
          </div>`).join("")}
        </div>
        ${canSpeak ? `<button class="btn ghost" id="playAll">${ICON_SAY}Play whole dialogue</button>` : ""}
      </div>`;
    }
    if (st.type === "kanji"){
      const k = L.kanji;
      h = `<div class="step">
        <div class="sign">
          <div class="sign-top">
            <div class="sign-k">${esc(k.kanji)}</div>
            <div class="sign-r" id="kr">tap below to reveal</div>
          </div>
          <div class="sign-bar">${esc((k.romaji || "").toUpperCase())}</div>
        </div>
        <button class="reveal" id="krev">What does it mean? Tap to reveal</button>
        <div class="card" id="kwhere" hidden style="display:flex;flex-direction:column;gap:8px">
          <div class="label">Where you'll see it</div>
          <p style="margin:0">${ruby(k.where)}</p>
          ${k.related ? `<p class="note" style="margin:0">${ruby(k.related)}</p>` : ""}
        </div>
      </div>`;
    }
    if (st.type === "tip"){
      h = `<div class="step"><div class="card tip" style="display:flex;flex-direction:column;gap:12px">
        <span class="hanko">${esc(L.tip.mark || "技")}</span>
        <h3>${ruby(L.tip.title)}</h3>
        <p>${ruby(L.tip.body)}</p>
      </div></div>`;
    }
    if (st.type === "challenge"){
      const c = L.challenge;
      h = `<div class="step">
        <div class="card" style="display:flex;flex-direction:column;gap:10px">
          <div class="label">Say it in Japanese</div>
          <p style="margin:0;font-size:17px">${ruby(c.prompt)}</p>
          ${c.hint ? `<button class="reveal" id="hint" style="font-size:14px">Need a hint?</button>` : ""}
        </div>
        <label class="label" for="answer">Your answer</label>
        <textarea id="answer" lang="ja" placeholder="ここに日本語で…"></textarea>
        <button class="btn primary" id="check">Check my answer</button>
        <div id="fb" class="card fb" hidden></div>
        <button class="reveal" id="model">Show a model answer</button>
      </div>`;
    }
    if (st.type === "done"){
      h = `<div class="step">
        <div class="card" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
          <span class="hanko">済</span>
          <h3 style="margin:0;font-size:20px">お{疲|つか}れ{様|さま}でした！</h3>
          <p style="margin:0">You reached the last stop. Quick review of today's phrases:</p>
        </div>
        <div class="card" style="display:flex;flex-direction:column;gap:12px">
          ${(L.phrases||[]).map(p => `<div><div class="jp-mid">${ruby(p.jp)}</div><div class="note">${esc(p.en)}</div></div>`).join("")}
        </div>
        <button class="btn ghost" id="restart">Ride again from the start</button>
      </div>`;
      h = h.replace("お{疲|つか}れ{様|さま}でした！", ruby("お{疲|つか}れ{様|さま}でした！"));
    }
    el.innerHTML = h;
    el.scrollTop = 0;
    wireStep(st);
    renderBoard();
    $("back").disabled = idx === 0;
    $("next").textContent = idx === steps.length - 1 ? "Done" : (idx === 0 ? "Start" : "Next");
    $("nav").hidden = false;
    store.set("pos:" + lesson.id, idx);
  }

  function wireStep(st){
    const L = lesson;
    if (st.type === "phrase"){
      $("rev").onclick = e => {
        const b = e.currentTarget; b.classList.add("open"); b.textContent = st.p.en;
        const n = $("pnote"); if (n) n.hidden = false;
      };
    }
    if (st.type === "dialogue"){
      document.querySelectorAll("[data-show]").forEach(b => b.onclick = () => {
        const en = document.querySelector(`[data-en="${b.dataset.show}"]`);
        en.classList.toggle("hid");
      });
      const pa = $("playAll");
      if (pa) pa.onclick = () => {
        try{
          speechSynthesis.cancel();
          L.dialogue.forEach(d => {
            const u = new SpeechSynthesisUtterance(plain(d.jp));
            u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice; u.rate = 0.95;
            speechSynthesis.speak(u);
          });
        }catch{}
      };
    }
    if (st.type === "kanji"){
      $("krev").onclick = e => {
        const k = L.kanji, b = e.currentTarget;
        $("kr").textContent = k.reading;
        b.classList.add("open"); b.textContent = k.meaning;
        $("kwhere").hidden = false;
        speak(k.reading);
      };
    }
    if (st.type === "challenge") wireChallenge();
    if (st.type === "done") $("restart").onclick = () => { idx = 0; renderStep(); };
  }

  /* ---------- challenge ---------- */
  function showFeedback(f){
    const box = $("fb");
    const v = (f.verdict || "").toLowerCase();
    const label = v === "great" ? "完璧！ Spot on" : v === "close" ? "おしい！ Almost" : "もう一回！ Have another go";
    box.innerHTML = `
      <div class="verdict"><span class="hanko" style="width:36px;height:36px;font-size:18px">${v === "great" ? "◎" : v === "close" ? "○" : "△"}</span>${esc(label)}</div>
      ${f.corrected ? `<div><div class="k">Corrected</div><div class="jp-mid">${ruby(f.corrected)}</div></div>` : ""}
      ${f.explanation ? `<div><div class="k">Why</div><p style="margin:0">${ruby(f.explanation)}</p></div>` : ""}
      ${f.natural ? `<div><div class="k">How a local might say it</div><div class="jp-mid">${ruby(f.natural)}</div>${sayBtn(f.natural)}</div>` : ""}`;
    box.hidden = false;
  }

  async function wireChallenge(){
    const L = lesson, c = L.challenge, ta = $("answer"), btn = $("check");
    const draftKey = "draft:" + L.id;
    ta.value = store.get(draftKey, "");
    ta.oninput = () => store.set(draftKey, ta.value);
    const hint = $("hint");
    if (hint) hint.onclick = () => { hint.classList.add("open"); hint.innerHTML = ruby(c.hint); };
    $("model").onclick = e => {
      const b = e.currentTarget; b.classList.add("open");
      b.innerHTML = `<div class="jp-mid">${ruby(c.model_answer)}</div>`;
    };
    const fb = $("fb");
    const compare = answer => {
      fb.innerHTML = `
        <div><div class="k">You wrote</div><div class="jp-mid">${esc(answer)}</div></div>
        <div><div class="k">Model answer</div><div class="jp-mid">${ruby(c.model_answer)}</div>${sayBtn(c.model_answer)}</div>
        <p class="note" style="margin:0">Different wording can still be right. For a full correction, copy your answer and ask Claude.</p>
        <button class="btn ghost" id="copyAsk">Copy a correction request</button>`;
      fb.hidden = false;
      $("copyAsk").onclick = async e => {
        const msg = `Correct my Japanese, please (I'm N4-N3).\nSituation: ${plain(c.prompt)}\nMy answer: ${answer}\nShow the corrected version, explain the main fix in 1-2 sentences, and give a more natural way a native speaker would say it.`;
        try{ await navigator.clipboard.writeText(msg); e.currentTarget.textContent = "Copied. Paste it into Claude"; }
        catch{ e.currentTarget.textContent = "Couldn't copy"; }
      };
    };
    const saved = store.get("answer:" + L.id, null);
    if (saved){ if (!ta.value) ta.value = saved; compare(saved); }
    btn.textContent = "Check my answer";
    btn.onclick = () => {
      const answer = ta.value.trim();
      if (!answer){ ta.focus(); return; }
      store.set("answer:" + L.id, answer);
      compare(answer);
      $("model").hidden = true;
      btn.textContent = "Check again";
    };
  }

  /* ---------- nav ---------- */
  $("back").onclick = () => { if (idx > 0){ idx--; renderStep(); } };
  $("next").onclick = () => {
    if (idx < steps.length - 1){ idx++; renderStep(); }
    else { idx = 0; renderStep(); }
  };
  let sx = null, sy = null;
  $("stage").addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, {passive:true});
  $("stage").addEventListener("touchend", e => {
    if (sx == null || !lesson || e.target.closest("textarea")) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if (dx < 0 && idx < steps.length - 1){ idx++; renderStep(); }
      if (dx > 0 && idx > 0){ idx--; renderStep(); }
    }
    sx = null;
  }, {passive:true});

  /* ---------- lessons list ---------- */
  const fmtDate = id => {
    const d = new Date(id + "T12:00:00");
    return isNaN(d) ? id : d.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
  };
  $("dateBtn").onclick = () => {
    if (!lessons.length) return;
    $("list").innerHTML = lessons.slice().reverse().map(l =>
      `<button class="lesson-item ${lesson && l.id === lesson.id ? "cur" : ""}" data-id="${esc(l.id)}"><span>${esc(l.topic)}</span><small>${esc(fmtDate(l.id))}</small></button>`).join("");
    $("drawer").hidden = false;
  };
  $("drawer").onclick = e => {
    const b = e.target.closest("[data-id]");
    if (b){ open(b.dataset.id); }
    if (b || e.target === $("drawer")) $("drawer").hidden = true;
  };

  async function open(id){
    const meta = lessons.find(l => l.id === id) || lessons[lessons.length - 1];
    if (!meta) return;
    let L;
    try{ L = await loadLesson(meta.id); }catch{ showEmpty("Can't load this lesson", "Check your connection and try again."); return; }
    const changed = !lesson || lesson.id !== L.id;
    lesson = L; steps = buildSteps(L);
    $("dateLabel").textContent = fmtDate(L.id) + (L.id === lessons[lessons.length-1].id ? " · today's lesson" : "");
    if (changed){ idx = Math.min(store.get("pos:" + L.id, 0), steps.length - 1); }
    try{ if (location.hash.slice(1) !== L.id) history.replaceState(null, "", "#" + L.id); }catch{}
    renderStep();
  }

  function showEmpty(title, body){
    $("stage").innerHTML = `<div class="empty step"><h2>${esc(title)}</h2><p class="note">${esc(body)}</p></div>`;
    $("dateLabel").textContent = "No lesson yet";
  }

  window.addEventListener("hashchange", () => {
    const id = location.hash.slice(1);
    if (id && lessons.some(l => l.id === id) && (!lesson || lesson.id !== id)) open(id);
  });

  /* ---------- data: static files ---------- */
  const cache = {};
  async function loadLesson(id){
    if (cache[id]) return cache[id];
    const r = await fetch("lessons/" + id + ".json", {cache: "no-cache"});
    if (!r.ok) throw new Error("missing");
    const L = await r.json(); L.id = id; cache[id] = L; return L;
  }
  (async () => {
    try{
      const r = await fetch("lessons/index.json", {cache: "no-cache"});
      const list = await r.json();
      const now = new Date(), today = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
      lessons = list.filter(l => l.id && l.topic && l.id <= today).sort((a, b) => a.id < b.id ? -1 : 1);
      if (!lessons.length){ showEmpty("Your first lesson arrives tomorrow morning", "A new lesson lands here every day at 7:47."); return; }
      const want = location.hash.slice(1);
      await open(lessons.some(l => l.id === want) ? want : lessons[lessons.length - 1].id);
    }catch{
      showEmpty("Can't load lessons", "Check your connection and reopen the app.");
    }
  })();
  if ("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch{} }
})();
</script>

</body>
