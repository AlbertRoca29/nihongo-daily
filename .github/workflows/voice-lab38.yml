name: Voice lab 3.8

# Gemini 3.8 TTS: Japanese voice library, designed voices, samples (scripts/voice_lab38.py).
# To run a step, put its arguments in samples/lab38/run.txt (e.g. "library", "design", "samples sota hana") and push.
on:
  push:
    branches: [master]
    paths: ["samples/lab38/run.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-lab38
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: x
        run: python3 scripts/voice_lab38.py $(cat samples/lab38/run.txt) 2>&1 | tee samples/lab38/last_run.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/lab38 voices38.json 2>/dev/null || git add samples/lab38
          git commit -m "Voice lab 3.8: $(cat samples/lab38/run.txt)" || exit 0
          for i in 1 2 3; do git pull --rebase origin master && git push origin HEAD:master && break; sleep 5; done
