name: Lesson audio

# Reads every lesson line with Google voices (see voices.json and scripts/tts.py).
# Runs when a lesson or the voice casting changes; only new or changed lines are made.
on:
  push:
    branches: [master]
    paths: ["lessons/**", "voices.json", "cast.json", "scripts/tts.py"]
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"   # 10:15 Madrid, after Gemini's daily limit resets: retry leftovers, back-fill older lessons

permissions:
  contents: write

concurrency:
  group: lesson-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stroke order for new kanji
        run: python3 scripts/strokes.py || true
      - name: Start VOICEVOX (free voices used in voices.json)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rubberband-cli
          if grep -q voicevox voices.json; then
            docker run -d -p 50021:50021 voicevox/voicevox_engine:cpu-latest
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 5; done
          fi
      - name: Make audio
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL: ${{ github.event_name == 'schedule' && '45' || '0' }}
        run: python3 scripts/tts.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio strokes
          git commit -m "Lesson audio" || exit 0
          for i in 1 2 3; do git pull --rebase origin master && git push origin HEAD:master && break; sleep 5; done
